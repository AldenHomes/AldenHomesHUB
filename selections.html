<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alden Homes | Selections</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root{
    --navy:#4B4F54; --navy-2:#33363a; --line:#d4d2c8; --line-soft:#ece8dd; --paper:#f5f4ef; --paper-2:#ffffff;
    --ink:#33363a; --ink-soft:#6b6f72; --sage:#A3AA83; --sage-2:#6B7355; --sage-soft:#eef0e8; --amber:#c98a2b; --amber-soft:#fdf3e2;
    --red:#a94438; --red-soft:#fbeae4; --good:#3f7a4e; --good-soft:#eaf1ec; --staff:#4a6b8a; --staff-soft:#e9eff5;
    --shadow:0 1px 2px rgba(30,32,34,.08),0 4px 14px rgba(30,32,34,.06); --radius:8px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;padding-bottom:96px}
  h1,h2,h3,p{margin:0}
  button,input,select,textarea{font-family:inherit;font-size:inherit}
  button{cursor:pointer}
  .mono{font-family:"Courier New",monospace}
  .muted{color:var(--ink-soft)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(12px,3vw,28px)}

  .top{background:var(--paper-2);border-bottom:4px solid var(--sage);position:sticky;top:0;z-index:50}
  .top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0}
  .logo{font-weight:800;letter-spacing:.5px;color:var(--navy)}
  .logo span{color:var(--sage-2)}
  .top a{color:var(--ink-soft);text-decoration:none;font-size:13px;font-weight:600}
  .grow{flex:1}
  .pill{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:var(--amber-soft);color:#8a5d14;border-radius:20px;padding:4px 10px}
  .viewsw{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
  .viewsw button{border:none;background:none;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink-soft)}
  .viewsw button.on{background:var(--navy);color:#fff}
  .viewsw button.on.staff{background:var(--staff)}
  .titlebar-account{display:flex;align-items:center;gap:10px}
  /* the same title bar as the hub's other apps: logo (back to the hub), app name */
  .top .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .top .brand img{height:36px;width:auto;display:block}
  .brand-t{font-size:clamp(18px,2.2vw,22px);font-weight:700;color:var(--navy)}
  .brand-s{font-size:11px;color:var(--ink-soft);letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
  body.public .top .brand{pointer-events:none}
  body.public .brand-s{display:none}
  body.public .staffonly, body.signedout .staffonly, body.signedout #viewSw{display:none!important}
  .login{max-width:400px;margin:60px auto 0}
  .login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:var(--radius);margin-top:6px}
  .login .err{color:var(--red);font-size:13.5px;min-height:20px;margin-top:8px}

  .btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:var(--radius);padding:10px 16px;font-weight:700;font-size:14.5px}
  .btn:hover{border-color:var(--navy)}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.good{background:var(--good);border-color:var(--good);color:#fff}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn:disabled{opacity:.45;cursor:default}
  .card{background:var(--paper-2);box-shadow:var(--shadow);border-radius:var(--radius);padding:18px 20px;margin-top:16px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--sage-2)}
  h1{font-size:26px;color:var(--navy);margin-top:4px}
  h2{font-size:18px;color:var(--navy)}
  .lede{color:var(--ink-soft);margin-top:6px;line-height:1.5;max-width:760px}
  label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
  input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
  .chip.v1{background:var(--amber-soft);color:#8a5d14}
  .chip.v2{background:var(--staff-soft);color:var(--staff)}
  .chip.signed{background:var(--good-soft);color:var(--good)}
  .chip.red{background:var(--red-soft);color:var(--red)}
  .chip.plain{background:var(--sage-soft);color:var(--sage-2)}

  /* leads list */
  .lead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line-soft)}
  .lead:first-child{border-top:none}
  .lead .who{flex:1 1 240px;min-width:0}
  .lead .who strong{font-size:16px;color:var(--navy)}
  .lead .amt{font-family:"Courier New",monospace;font-weight:700;color:var(--navy);min-width:110px;text-align:right}

  /* tabs */
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:16px;border-bottom:2px solid var(--line)}
  .tab{border:none;background:none;padding:10px 14px;font-weight:700;font-size:14.5px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab.on{color:var(--navy);border-bottom-color:var(--sage-2)}
  .tab.staff{color:var(--staff)}
  .tab.staff.on{border-bottom-color:var(--staff)}
  .tab .n{font-size:11px;background:var(--red-soft);color:var(--red);border-radius:10px;padding:1px 7px;margin-left:5px}

  /* rooms layout */
  .rooms{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;margin-top:16px;align-items:start}
  @media (max-width:820px){ .rooms{grid-template-columns:1fr} .roomnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:static!important} .roomnav button{flex:none;width:auto;min-width:150px;background:var(--paper-2);border-color:var(--line-soft)} }
  .roomnav{position:sticky;top:76px}
  .roomnav button{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:var(--radius);padding:9px 11px;margin-bottom:4px;color:var(--ink)}
  .roomnav button.on{background:var(--paper-2);border-color:var(--line);box-shadow:var(--shadow)}
  .roomnav .rn{font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
  .roomnav .rp{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .roomnav .done{color:var(--good)}
  .roomnav .bar{height:4px;background:var(--line-soft);border-radius:2px;margin-top:6px;overflow:hidden}
  .roomnav .bar span{display:block;height:100%;background:var(--sage-2)}
  .deadline{font-size:12.5px;background:var(--amber-soft);color:#8a5d14;border-radius:6px;padding:7px 10px;margin-top:10px;display:inline-block}

  /* questions */
  .q{background:var(--paper-2);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px 18px;margin-top:14px}
  .q.todo{border-left:4px solid var(--amber)}
  .q-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .q-head h3{font-size:16.5px;color:var(--navy)}
  .q-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  .opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:12px}
  .opt{position:relative;text-align:left;border:2px solid var(--line);background:#fff;border-radius:var(--radius);padding:0;overflow:hidden;color:var(--ink)}
  .opt:hover{border-color:var(--sage)}
  .opt.sel{border-color:var(--good);box-shadow:0 0 0 2px var(--good-soft)}
  .opt:disabled{cursor:default;opacity:.85}
  .opt .art{height:78px;background:#f7f6f1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .opt .art svg{width:100%;height:100%}
  .opt .txt{padding:9px 11px 10px}
  .opt .nm{font-weight:700;font-size:14px;line-height:1.3}
  .opt .pr{font-size:13px;margin-top:3px;font-family:"Courier New",monospace;font-weight:700;color:var(--navy)}
  .opt .pr.inc{color:var(--good);font-family:inherit}
  .opt .std{position:absolute;top:6px;left:6px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:rgba(255,255,255,.92);color:var(--good);border-radius:4px;padding:2px 6px}
  .opt .tick{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;font-size:13px;display:none;align-items:center;justify-content:center}
  .opt.sel .tick{display:flex}
  .opt .fav{position:absolute;bottom:6px;right:8px;font-size:17px;color:#c9c4b5;line-height:1}
  .opt .fav.on{color:var(--red)}
  .staffline{font-size:11.5px;color:var(--staff);background:var(--staff-soft);border-radius:4px;padding:3px 6px;margin-top:6px;line-height:1.4}
  .eachrow{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-soft)}
  .eachrow:first-of-type{border-top:none;padding-top:0}
  .eachrow .rm{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft)}
  .qty{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
  .stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
  .stepper button{border:none;background:#fff;width:44px;height:44px;font-size:22px;color:var(--navy)}
  .stepper button:disabled{opacity:.3}
  .stepper span{min-width:48px;text-align:center;font-weight:700;font-size:18px}
  .changed{font-size:12.5px;background:var(--amber-soft);color:#8a5d14;border-radius:6px;padding:6px 10px;margin-top:10px;display:inline-block}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);padding:8px 8px;border-bottom:2px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  .num{text-align:right;font-family:"Courier New",monospace;white-space:nowrap}
  tr.tot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
  tr.grp td{background:#faf8f2;font-weight:700;color:var(--navy);font-size:13px}
  td.st, th.st{color:var(--staff)}

  .banner{border-radius:var(--radius);padding:14px 16px;margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .banner.amber{background:var(--amber-soft);border:1px solid #ecd9b0;color:#6e4a10}
  .banner.good{background:var(--good-soft);border:1px solid #c5dccb;color:#27573a}
  .banner.staff{background:var(--staff-soft);border:1px solid #c9d8e6;color:#2c4a66}
  .banner p{flex:1 1 280px;line-height:1.45;font-size:14.5px}

  .totalbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper-2);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(30,32,34,.08);z-index:40}
  .totalbar .in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0}
  .totalbar .big{font-family:"Courier New",monospace;font-size:24px;font-weight:700;color:var(--navy)}
  .totalbar .sub{font-size:12.5px;color:var(--ink-soft)}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--navy-2);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
  .toast.show{opacity:1}
  /* the customer's own screen: bigger, nothing but their choices */
  body.present{font-size:18px}
  body.present .opts{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  body.present .opt .art{height:130px}
  body.present .opt .nm{font-size:17px}
  body.present .opt .pr{font-size:16px}
  body.present .q-head h3{font-size:21px}
  body.present .q{padding:20px 22px}
  body.present #viewSw, body.present .top a:not(.brand), body.present .pill{display:none}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--good)}
  .live i{width:9px;height:9px;border-radius:50%;background:var(--good);animation:livePulse 1.6s ease-in-out infinite}
  @keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(63,122,78,.5)}50%{box-shadow:0 0 0 7px rgba(63,122,78,0)}}
  .opt.flash{animation:optFlash 1.6s ease-out}
  @keyframes optFlash{0%{box-shadow:0 0 0 6px rgba(201,138,43,.75)}100%{box-shadow:0 0 0 2px var(--good-soft)}}
  .sharebox{background:var(--staff-soft);border:1px solid #c9d8e6;border-radius:var(--radius);padding:14px 16px;margin-top:14px;color:#2c4a66}
  .sharebox input{font-family:"Courier New",monospace;font-size:13px;margin-top:8px}
  /* the shareable selection sheet (?show=LEAD): no prices, made to be passed around */
  body.show{background:#fff;padding-bottom:0}
  body.show .top, body.show .totalbar{display:none!important}
  body.show #root{max-width:none;padding:0}
  .sh, .sh *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sh-hero{background:linear-gradient(155deg,#2b2e31 0%,#4B4F54 55%,#646b4e 100%);color:#fff;padding:40px 0 48px;text-align:center}
  .sh-logo{display:block;width:fit-content;margin:0 auto;background:#fff;border-radius:10px;padding:12px 22px}
  .sh-logo img{height:58px;display:block}
  .sh-kicker{letter-spacing:3.5px;text-transform:uppercase;font-size:12px;font-weight:700;color:#cfd3b8;margin-top:30px}
  .sh-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,7vw,62px);font-weight:700;line-height:1.05;margin-top:10px;color:#fff}
  .sh-sub{color:#e9ebdf;margin-top:14px;font-size:17px}
  .sh-stats{display:flex;justify-content:center;gap:clamp(22px,6vw,64px);flex-wrap:wrap;margin-top:32px}
  .sh-stat b{display:block;font-family:Georgia,serif;font-size:38px;line-height:1;color:#fff}
  .sh-stat span{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#cfd3b8;margin-top:7px}
  .sh-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .sh-actions button{border:none;border-radius:24px;padding:12px 22px;font-weight:700;font-size:15px;background:#fff;color:var(--navy)}
  .sh-actions button.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6)}
  .sh-sec{padding:40px 0 4px}
  .sh-sec h2{font-family:Georgia,serif;font-size:29px;color:var(--navy);display:flex;align-items:center;gap:14px}
  .sh-sec h2:after{content:"";flex:1;height:2px;background:var(--sage)}
  .sh-lede{color:var(--ink-soft);margin-top:8px;font-size:16px;max-width:680px;line-height:1.5}
  .sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-top:20px}
  .sh-grid.big{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .sh-tile{position:relative;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow);break-inside:avoid;page-break-inside:avoid}
  .sh-tile .art{height:118px;background:#f7f6f1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sh-grid.big .sh-tile .art{height:170px}
  .sh-tile .art svg{width:100%;height:100%}
  .sh-tile .art .count{font-family:Georgia,serif;font-size:56px;font-weight:700;color:var(--sage-2)}
  .sh-tile .txt{padding:12px 14px 14px}
  .sh-tile .lab{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--sage-2)}
  .sh-tile .val{font-size:17px;font-weight:700;color:var(--navy);line-height:1.25;margin-top:3px}
  .sh-grid.big .sh-tile .val{font-family:Georgia,serif;font-size:22px}
  .sh-tile .up{position:absolute;top:10px;left:10px;background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-radius:20px;padding:4px 10px}
  .sh-made{border-left:5px solid var(--sage);background:#faf8f2;border-radius:0 10px 10px 0;padding:16px 20px;margin-top:14px;font-family:Georgia,serif;font-size:20px;color:var(--navy);break-inside:avoid}
  .sh-cta{background:var(--sage-soft);border-top:4px solid var(--sage);margin-top:48px;padding:44px 0 50px;text-align:center}
  .sh-cta h2{font-family:Georgia,serif;font-size:clamp(26px,4.5vw,36px);color:var(--navy)}
  .sh-cta p{color:var(--ink-soft);margin-top:10px;font-size:17px}
  .sh-cta .who{margin-top:20px;font-weight:700;color:var(--navy);font-size:18px}
  .sh-foot{text-align:center;color:var(--ink-soft);font-size:12px;padding:16px 0 26px}
  .sharelink{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .sharelink input{flex:1 1 280px;font-family:"Courier New",monospace;font-size:13px}
  body.pdfing .noprint{display:none!important}
  @page{margin:0}
  /* office notes + follow-up on a lead (never shown to the customer) */
  .office{background:var(--staff-soft);border:1px solid #c9d8e6;border-radius:var(--radius);padding:16px 18px;margin-top:16px}
  .office h2{color:var(--staff);font-size:16px}
  .office-cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:12px}
  .office textarea{min-height:64px;resize:vertical}
  .note{background:#fff;border-radius:6px;padding:9px 11px;margin-top:8px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;display:flex;gap:8px}
  .note .when{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .note .x{border:none;background:none;color:var(--ink-soft);font-size:18px;line-height:1;padding:0 2px;align-self:flex-start}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip.due{background:var(--red-soft);color:var(--red)}
  .chip.soon{background:var(--amber-soft);color:#8a5d14}
  .chip.later{background:var(--staff-soft);color:var(--staff)}
  /* the Pricing meeting: the paper pricing sheet, one row per line */
  .prow{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line-soft)}
  .prow:first-child{border-top:none;padding-top:2px}
  .prow .pl{flex:1 1 220px;min-width:0}
  .prow .pt{font-weight:700;font-size:15px;color:var(--navy)}
  .prow .pn{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .prow .pc{flex:0 1 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .prow.long .pc{flex:1 1 100%}
  .segs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .seg{border:2px solid var(--line);background:#fff;border-radius:22px;padding:7px 13px;font-size:14px;font-weight:700;color:var(--ink);line-height:1.2;text-align:center}
  .seg small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-soft);font-family:"Courier New",monospace}
  .seg:hover{border-color:var(--sage)}
  .seg.on{border-color:var(--good);background:var(--good-soft);color:#27573a}
  .seg.on.dflt{border-color:var(--line);background:#f3f2ec;color:var(--ink-soft)}
  .seg:disabled{cursor:default;opacity:.8}
  .prow input[type=number]{width:104px;text-align:right}
  .prow input[type=text]{width:240px;max-width:100%}
  .prow textarea{width:100%;min-height:58px;resize:vertical}
  .prow .tot{font-family:"Courier New",monospace;font-weight:700;color:var(--navy);white-space:nowrap}
  .prow .stepper button{width:38px;height:38px;font-size:20px}
  .prow .stepper span{min-width:40px;font-size:16px}
  body.present .prow .pt{font-size:18px}
  body.present .seg{font-size:16px;padding:10px 16px}
  .sh-tile .art .noart{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef0e8,#dfe3d0);color:var(--sage-2);font-family:Georgia,serif;font-size:17px;font-weight:700;text-align:center;padding:10px}
  /* custom items: the + button on every section */
  .addbtn{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--line);background:none;border-radius:var(--radius);padding:10px 16px;font-weight:700;font-size:14.5px;color:var(--navy);margin-top:14px}

  const cs = choicesOf(q, L), cust = view === 'customer';
  const have = cs.filter(c=>{ const a = L.answers[q.id + '#' + c.i]; return a && (a.qty || (c.rate && a.price)); });
  const rows = have.map(c=>{
    const k = q.id + '#' + c.i, a = L.answers[k], n = a.qty || 0, p = a.price || 0;
    const each = cust ? '' : c.rate
      ? `<span class="muted">at $</span><input type="number" min="0" step="0.01" data-rate="${esc(k)}" value="${p || ''}" placeholder="0.00" style="width:90px" aria-label="Price per sq ft" ${lock ? 'disabled' : ''}><span class="muted" style="font-size:13px">/ sq ft</span>`
      : `<span class="cp">${p ? (p < 0 ? '− ' + money2(-p) + ' credit' : '+ ' + money2(p)) : 'no charge'} / sq ft</span>`;
    return `<div class="cho on ${flashKey === k ? 'flash' : ''}"><span class="ct">${esc(c.t)}</span>${each}
      <input type="number" min="0" step="1" data-bt-num="${esc(k)}" value="${n || ''}" placeholder="0" ${lock ? 'disabled' : ''}><span class="muted" style="font-size:13px">sq ft</span>
      ${!cust && n && p ? `<span class="cp">= ${plus(Math.round(p * n * 100) / 100)}</span>` : ''}
      <button type="button" class="tog" data-floor-del="${esc(k)}" ${lock ? 'disabled' : ''}>Remove</button></div>`;
  }).join('');
  if(lock) return rows;
  const ft = FLOOR_TYPES.find(x=>x.key === floorPick.type) || FLOOR_TYPES[0];
  const lv = ft.levels.includes(floorPick.level) ? floorPick.level : ft.levels[0] || 0;
  const pc = cs.find(c=>c.ft === ft.key && c.lv === lv);
  const each = cust || !pc ? '' : pc.rate ? '<span class="muted" style="font-size:13px">price typed once added</span>'
    : pc.p == null ? '<span class="cp tbd">price to come</span>' : `<span class="cp">${pc.p ? (pc.p < 0 ? '− ' + money2(-pc.p) + ' credit' : '+ ' + money2(pc.p)) : 'no charge'} / sq ft</span>`;

    <select data-floor-type aria-label="Flooring type">${FLOOR_TYPES.map(x=>`<option value="${x.key}" ${x.key === ft.key ? 'selected' : ''}>${esc(x.t)}</option>`).join('')}</select>
    ${ft.levels.length ? `<select data-floor-level aria-label="Level">${ft.levels.map(n=>`<option value="${n}" ${n === lv ? 'selected' : ''}>Level ${n}</option>`).join('')}</select>` : ''}
    <input type="number" min="0" step="1" id="floorSq" placeholder="0" style="width:90px" aria-label="Square feet"><span class="muted" style="font-size:13px">sq ft</span>${each}
    <button type="button" class="tog" data-floor-add="${esc(q.id)}">Add</button></div>`;
}

/* ---------- saving: the open sheet and the hub's server ----------
   Every second the open sheet either sends what changed or asks whether anything is new (another office device, or the
   customer's screen). Only the changes travel, so two people tapping at once don't undo each other. */
const SEL_URL = 'https://us-central1-alden-homes-hub.cloudfunctions.net/selectionsApi';
const SYNC_FIELDS = ['name','name2','phone','email','dev','lot','model','stage','created','v1Date','updated','pricedOn','v1Snap','custom','favs','cos','signedOn','quoteOk','line','basePrice','notes','follow','address'];
let KEYS = {}, REMOTE = {}, TEAM = [], present = {}, flushId = '';   // link keys; the server's last copy of each sheet; the team; open customer screens
async function selApi(body){
  const u = window.firebase && firebase.apps.length && firebase.auth().currentUser;
  const headers = { 'Content-Type':'application/json' };
  if(u && !PRESENT && !SHOW && !QUOTE) headers.Authorization = 'Bearer ' + await u.getIdToken();
  else body = { ...body, k: LINK_K };
  const res = await fetch(SEL_URL, { method:'POST', headers, body:JSON.stringify(body) });
  if(!res.ok){ const e = new Error('selectionsApi ' + res.status); e.status = res.status; throw e; }
  return res.json();
}
const pending = ()=>{ const L = lead(); return !!(L && sync.id === L.id && sync.last && diffSheet(sync.last, L).any); };
window.addEventListener('beforeunload', e=>{ if(pending() || (flushId && sync.id === flushId)){ e.preventDefault(); e.returnValue = ''; } });
// send what's left on a sheet before moving on (leaving it, signing)
async function flush(){ for(let n = 0; n < 12; n++){ if(!sync.busy){ await syncTick(); if(!pending() && !(flushId && sync.id === flushId)) return true; } await new Promise(r=>setTimeout(r, 250)); } return false; }
let sync = { id:'', rev:0, last:null, busy:false, nav:'', state:'off', fails:0 };   // state: off | connecting | live | lost | missing
const clone = o=>JSON.parse(JSON.stringify(o));
const same = (a, b)=>JSON.stringify(a) === JSON.stringify(b);
function diffSheet(from, to){
  const ans = {}, del = [], top = {};
  Object.keys(to.answers || {}).forEach(k=>{ if(!from || !same((from.answers || {})[k], to.answers[k])) ans[k] = to.answers[k]; });
  Object.keys((from && from.answers) || {}).forEach(k=>{ if(!(k in (to.answers || {}))) del.push(k); });
  SYNC_FIELDS.forEach(f=>{ if(!from || !same(from[f], to[f])) top[f] = to[f] === undefined ? null : to[f]; });
  return { ans, del, top, any: !!(Object.keys(ans).length || del.length || (from && Object.keys(top).length)) };
}
const syncOn = ()=>!SHOW && !QUOTE && !!(PRESENT || cur || flushId) && CAT_READY;
async function syncTick(){
  if(!syncOn()){ if(sync.state !== 'off'){ sync = { id:'', rev:0, last:null, busy:false, nav:'', state:'off', fails:0 }; } return; }
  if(sync.busy) return;
  const sid = PRESENT || cur || flushId;
  if(sync.id !== sid) sync = { id:sid, rev: REMOTE[sid] ? REMOTE[sid].rev : 0, last: REMOTE[sid] ? clone(REMOTE[sid].sheet) : null, busy:false, nav:'', state:'connecting', fails:0 };
  const L = leads.find(l=>l.id === sid), sent = L ? clone(L) : null;
  let body;
  const navNow = !PRESENT && L && !['vendors','codes'].includes(tab) ? JSON.stringify({ tab, roomId: navRoom() }) : '';
  if(!PRESENT && L && !sync.last){
    // a new sheet: this device's copy is the first one
    body = { action:'patch', id:sid, full:clone(sent), ans:sent.answers, del:[], top:diffSheet(null, sent).top, nav:navNow ? JSON.parse(navNow) : null };
  } else if(L && sync.last){
    const d = diffSheet(sync.last, L), navChanged = navNow && navNow !== sync.nav && sid === cur;
    body = d.any || navChanged ? { action:'patch', id:sid, ans:d.ans, del:d.del, top:d.top, ...(navChanged ? { nav:JSON.parse(navNow) } : {}) } : { action:'get', id:sid, since:sync.rev };
  } else body = { action:'get', id:sid, since:0 };
  if(!cur && flushId && body.action === 'get'){ flushId = ''; return; }   // nothing left to send on the sheet just left
  sync.busy = true;

  try{
    const data = await selApi(body);
    if(data.key) KEYS[forId] = data.key;
    if(data.sheet) REMOTE[forId] = { rev: data.rev, sheet: clone(data.sheet) };
    if(forId !== (PRESENT || cur || flushId)) return;   // they opened a different sheet meanwhile
    sync.fails = 0;
    const before = sync.state;
    if(data.missing){ sync.state = 'missing'; }
    else {
      sync.state = 'live';

      if(data.sheet){ if(forId === (PRESENT || cur)) takeRemote(data.sheet, sent, body); else { const i = leads.findIndex(l=>l.id === forId); if(i >= 0) leads[i] = norm(clone(data.sheet)); sync.last = clone(data.sheet); } sync.rev = data.rev; }

function styleSet(id, st){

  c.skip = (c.skip || []).filter(x=>x !== id); c.incl = (c.incl || []).filter(x=>x !== id);
  if(st === 'hide') c.skip.push(id); else if(st === 'incl') c.incl.push(id);
  if(!c.skip.length && !c.incl.length && !c.ceil) delete STYLE_CFG[styName];
  const y = window.scrollY; render(); window.scrollTo(0, y); styleSave();
}

/* one question, in any of its forms */
function question(q, L, opts){
  if(!asked(q, L)) return '';
  if(q.opt) return prow(q, L);
  const staff = view === 'staff', lock = locked(L);
  const snap = L.v1Snap || {};
  const optCard = (key, o, i)=>{
    const a = L.answers[key], sel = a && a.label === o[0];
    const fav = L.favs[key + '|' + o[0]];
    // a sheet shows the price it was quoted at for the picked option, today's price for the others
    const price = sel ? a.price : o[1], cost = sel ? a.cost : o[2];
    return `<button type="button" class="opt ${sel?'sel':''}${sel && flashKey === key ? ' flash' : ''}" data-pick="${esc(key)}" data-opt="${esc(o[0])}" ${lock?'disabled':''}>
      <div class="art">${o[3] || ''}</div>${i === 0 ? '<span class="std">Standard</span>' : ''}<span class="tick">&#10003;</span>
      <div class="txt"><div class="nm">${esc(o[0])}</div>
        <div class="pr ${price === 0 ? 'inc' : ''}">${price === 0 ? (i === 0 ? 'Included' : 'No extra cost') : plus(price)}</div>
        ${staff && price ? `<div class="staffline">our cost ${money(cost)} · margin ${money(price - cost)}</div>` : ''}</div>
      ${!lock && !sel ? `<span class="fav ${fav?'on':''}" data-fav="${esc(key + '|' + o[0])}" title="Mark as a favourite">${fav ? '&#9829;' : '&#9825;'}</span>` : ''}
    </button>`;
  };
  const changed = key=>{
    if(!q.v1 || !L.v1Snap || !L.answers[key] || snap[key] == null || snap[key] === L.answers[key].label) return '';
    const was = q.o.find(o=>o[0] === snap[key]), diff = L.answers[key].price - (was ? was[1] : 0);
    return `<div class="changed">Changed since pricing: was <strong>${esc(snap[key])}</strong> · ${diff === 0 ? 'no change in price' : (diff > 0 ? '+ ' : '− ') + money(Math.abs(diff))}</div>`;
  };
  const miss = missing(q, L);
  let inner;
  if(q.type === 'qty'){
    const a = L.answers[q.id] || { qty:0, price:q.price, cost:q.cost };
    inner = `<div class="qty"><div class="stepper"><button type="button" data-qty="${q.id}" data-d="-1" ${lock || !a.qty ? 'disabled' : ''}>&minus;</button><span>${a.qty}</span><button type="button" data-qty="${q.id}" data-d="1" ${lock || a.qty >= q.max ? 'disabled' : ''}>+</button></div>
      <div><strong>${money(a.price)}</strong> per ${esc(q.unit)}${a.qty ? ` · <span class="mono" style="font-weight:700;color:var(--navy)">+ ${money(a.price * a.qty)}</span>` : ''}
        ${staff ? `<div class="staffline">our cost ${money(a.cost)} each · margin ${money(a.price - a.cost)} each</div>` : ''}</div></div>`;
  } else if(q.each){
    inner = q.each.map(r=>{ const key = q.id + '@' + r; return `<div class="eachrow"><div class="rm">${esc(r)}${!L.answers[key] ? ' <span class="chip red" style="margin-left:6px">to choose</span>' : ''}</div><div class="opts">${q.o.map((o,i)=>optCard(key, o, i)).join('')}</div></div>`; }).join('');
  } else {
    inner = `<div class="opts">${q.o.map((o,i)=>optCard(q.id, o, i)).join('')}</div>${changed(q.id)}`;
  }
  return `<div class="q ${miss.length && !lock ? 'todo' : ''}" id="q-${q.id}">
    <div class="q-head"><h3>${esc(q.t)}</h3>
      ${q.v1 && opts.fullSheet ? '<span class="chip v1">priced at the first meeting</span>' : ''}
      ${q.type === 'color' ? '<span class="chip plain">colour · no cost</span>' : ''}
      ${q.each ? '<span class="chip plain">pick for each room</span>' : ''}
      ${staff ? `<span class="chip" style="background:var(--staff-soft);color:var(--staff)">code ${q.cc} · ${esc(q.vendor || 'Alden')}</span>` : ''}</div>
    ${q.note ? `<div class="q-sub">${esc(q.note)}</div>` : ''}
    ${inner}</div>`;
}

/* ---------- what's in this home ----------
   Whole groups of selections only matter if the home has the thing: basement extras need a basement, the third-bath lines
   need a third bath. Most are settled by what was picked at pricing (take a basement there and its detail lines appear here);
   two have no line of their own to go by, so they're simply switched on or off. A chip at the top of the sheet shows each one
   and can override it. Switched off = those selections are left off the sheet entirely. */
const FEATURES = [
  { id:'bsmt',   name:'Basement',            heads:[126],         from:127, to:149 },
  { id:'bath3',  name:'Third bath',          heads:[],            from:340, to:378, dflt:false },
  { id:'powder', name:'Powder bath',         heads:[],            from:379, to:399, dflt:true },
  { id:'fire',   name:'Fireplace',           heads:[550],         from:551, to:599 },
  { id:'deck',   name:'Patio or deck',       heads:[600, 640],    from:601, to:659 },
  { id:'porch',  name:'Porch or sunroom',    heads:[660,672,684], from:660, to:699 },
  { id:'attic',  name:'Attic room',          heads:[760],         from:761, to:779 },
  { id:'second', name:'Second-floor space',  heads:[740],         from:741, to:759 },
];
const featOf = q=>FEATURES.find(f=>q.num >= f.from && q.num <= f.to && !f.heads.includes(q.num));
// how many choices on the sheet sit inside a feature (its own line counts: taking a basement is what turns the basement on)
function featCount(L, f){
  const lo = Math.min(f.from, ...f.heads), hi = f.to;
  return Object.keys(L.answers).filter(k=>{ if(!k.includes('#') || !L.answers[k].qty || L.answers[k].auto) return false; const q = qOfKey(k); return q && ((q.num >= lo && q.num <= hi) || f.heads.includes(q.num)); }).length;
}
function hasFeat(L, f){
  const o = L.answers['has:' + f.id];
  if(o) return o.qty > 0;
  if(f.heads.some(h=>ALL_QS.some(q=>q.num === h && isIncl(q, L) && asked(q, L)))) return true;
  return featCount(L, f) > 0 || !!f.dflt;
}
// the sections of a meeting that have anything to ask for this home
const sectionsFor = (L, list)=>list.filter(r=>r.qs.some(q=>asked(q, L)));

/* ---------- one at a time, or the whole section ---------- */
let gIdx = 0, followGuide = null;
const modes = { v1:'list', full:'guide' };          // pricing is a quick pass down a list; selections is talked through item by item
try{ Object.assign(modes, JSON.parse(localStorage.getItem('aldenSelModes') || '{}')); } catch(e){}
const modeOf = ()=>PRESENT && followGuide !== null ? (followGuide ? 'guide' : 'list') : (modes[tab] || 'list');
// where the office is, for the customer's screen to follow: the section, and in one-at-a-time view which selection
const navRoom = ()=>roomId + ((tab === 'v1' || tab === 'full') && modeOf() === 'guide' ? '~' + gIdx : '');
function setNavRoom(str){ const p = String(str || '').split('~'); if(p[0]) roomId = p[0]; if(p.length > 1){ gIdx = Number(p[1]) || 0; followGuide = true; } else followGuide = false; }

// One meeting's worth of sections, with the list down the side. kind 'v1' = Pricing (the lines on the paper pricing sheet),
// 'full' = Selections (everything). Same answers either way. Each can be worked one selection at a time or as a whole section.
function sheetView(L, kind){
  const pricing = kind === 'v1', list = sectionsFor(L, pricing ? PRICING : ROOMS);
  if(!list.length) return '<div class="card"><p class="muted">Nothing to choose for this home.</p></div>';
  const r = list.find(x=>x.id===roomId) || list[0], i = list.indexOf(r), next = list[i+1], prev = list[i-1];
  if(r.id !== roomId) roomId = r.id;
  const ls = lines(L), lock = locked(L);
  const nav = list.map(x=>{ const n = ls.filter(l=>l.q.room.id === x.id && !l.typed).length + L.custom.filter(c=>c.room === x.id).length;
    return `<button type="button" class="${r.id===x.id?'on':''}" data-room="${x.id}"><div class="rn"><span>${esc(x.name)}</span>${n ? `<span class="done" style="font-size:12px">${n}</span>` : ''}</div></button>`; }).join('');
  const qs = r.qs.filter(q=>asked(q, L));
  const nk = noteKey(r), note = L.answers[nk];
  const guide = modeOf() === 'guide';
  const hasbar = PRESENT ? '' : `<div class="hasbar noprint"><span>This home has:</span>${FEATURES.map(f=>{ const on = hasFeat(L, f), n = featCount(L, f);
      return `<button type="button" class="${on ? 'on' : ''}" data-has="${f.id}" ${lock ? 'disabled' : ''} title="${on ? 'Its selections are on the sheet' : 'Its selections are left off the sheet'}">${on ? '&#10003; ' : ''}${esc(f.name)}${n ? ' · ' + n : ''}</button>`; }).join('')}
      <div class="grow"></div><div class="modesw"><button type="button" class="${guide ? 'on' : ''}" data-mode="guide">One at a time</button><button type="button" class="${guide ? '' : 'on'}" data-mode="list">Whole section</button></div></div>`;
  const notes = `<div class="sel"><div class="sel-h" style="cursor:default"><b style="font-size:15.5px;font-family:inherit">Notes for ${esc(r.name)}</b></div><textarea data-note="${esc(nk)}" maxlength="600" style="margin-top:8px;min-height:54px;resize:vertical" ${lock ? 'disabled' : ''}>${esc(note ? note.label : '')}</textarea></div>`;
  const finish = pricing && !next && !lock ? `<div class="card noprint" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <p style="flex:1 1 260px"><strong>That's the whole pricing sheet.</strong> Anything left untouched stays at standard. It's saved as a lead either way, and everything picked here is already on the selections sheet for the next meeting.</p>
      ${PRESENT ? '' : '<button type="button" class="btn" id="saveClose">Save &amp; close</button>'}
      <button type="button" class="btn primary" id="toFull">Carry on to selections</button></div>` : '';
  let body;
  if(guide){
    gIdx = Math.max(0, Math.min(qs.length - 1, gIdx));
    const q = qs[gIdx], atEnd = gIdx >= qs.length - 1;
    const picked = q ? choicesOf(q, L).some(c=>(L.answers[q.id + '#' + c.i] || {}).qty) || L.custom.some(c=>c.q === q.id) : false;
    const fwd = !atEnd ? (picked ? 'Next' : 'Keep standard') : next ? 'On to ' + next.name : pricing ? 'Finish pricing' : 'See the summary';
    body = `<div class="guide">
      <div class="g-top"><span>${esc(r.name)} · ${qs.length ? gIdx + 1 : 0} of ${qs.length}</span><div class="bar"><span style="width:${qs.length ? (gIdx + 1) / qs.length * 100 : 0}%"></span></div></div>
      <div class="q">${q ? prow(q, L, true) : '<p class="muted">Nothing to choose here for this home.</p>'}
        ${q && !picked && !lock && !stdOf(q, L) && !isIncl(q, L) ? '<div class="g-std">Nothing picked means this stays standard.</div>' : ''}
        ${q ? customBlock(L, r, q) : ''}</div>
      <div class="g-nav noprint">
        ${gIdx > 0 || prev ? `<button type="button" class="btn" data-g="-1">&larr; Back</button>` : ''}
        <div class="grow"></div>
        <button type="button" class="btn primary" data-g="1">${esc(fwd)} &rarr;</button></div>
      ${atEnd ? `<div class="q" style="padding:6px 18px 12px;margin-top:16px">${notes}</div>${customBlock(L, r, null, true)}${finish}` : ''}
    </div>`;
  } else {
    openDefault(qs);
    body = `<div class="q" style="padding:6px 18px 12px">${qs.map(q=>prow(q, L)).join('') || '<p class="muted" style="padding:10px 0">Nothing to choose here for this home.</p>'}${notes}</div>
      ${customBlock(L, r)}
      ${finish}
      <div class="noprint" style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">

      </div>`;
  }
  return `${hasbar}<div class="rooms">
    <div class="roomnav noprint">${nav}</div>
    <div>
      <div class="eyebrow">${pricing ? 'Pricing · first meeting' : 'Selections · the deep dive'} · section ${i+1} of ${list.length}</div>

}

/* ---------- custom items: the + on every section ----------
   Anyone can add something that isn't on the sheet. Either type a price on the spot, or mark it "needs a price" and pick who
   should price it. Until it has a price it shows as "price to come", stays out of the total, and the sheet can't be confirmed
   or signed. The person picked gets a notice on their hub bell (and an email) that opens this sheet. TEAM = the hub's logins. */
let cuOpen = '', cuMode = 'now';   // '' = closed; otherwise the question (or section) whose "add a custom item" form is open
const waiting = L=>L.custom.filter(c=>c.pending);

// loose: only the section's items that aren't tied to a question, with no add button (end of a section in One at a time).
function customBlock(L, r, q, loose){
  const staff = view === 'staff', lock = locked(L), forId = q ? q.id : r.id;
  const mine = L.custom.map((c, ci)=>({ c, ci })).filter(x=>x.c.room === r.id && (q ? x.c.q === q.id : loose ? !x.c.q : true));
  const items = mine.map(({ c, ci })=>`<div class="custom ${c.pending ? 'wait' : ''}">
      <div class="q-head"><h3 style="font-size:16px;color:var(--navy)">${esc(c.desc)}</h3><span class="chip plain">custom item</span>${c.pending ? `<span class="chip soon">price to come${c.ask ? ' · asked ' + esc(c.ask) : ''}</span>` : ''}</div>
      ${c.pending ? (PRESENT ? '<div class="q-sub">We\'re getting a price on this for you.</div>'
          : `<div class="row2 noprint"><span class="muted">$</span><input type="number" min="0" step="1" placeholder="Price" data-cuprice="${ci}">${staff ? `<input type="number" min="0" step="1" placeholder="Our cost" data-cucost="${ci}">` : ''}<button type="button" class="btn sm primary" data-cuset="${ci}">Set price</button>${lock ? '' : `<button type="button" class="btn sm" data-delcustom="${ci}">Remove</button>`}</div>`)
        : `<div class="row2">${view === 'customer' ? '' : `<span class="mono" style="font-weight:700;color:var(--navy)">${plus(c.price)}</span>`}${staff ? `<span class="staffline">our cost ${money(c.cost)} · margin ${money(c.price - c.cost)} · code ${c.cc}</span>` : ''}${!lock && !PRESENT ? `<button type="button" class="btn sm noprint" data-delcustom="${ci}">Remove</button>` : ''}</div>`}
    </div>`).join('');
  if(lock || PRESENT || loose) return items;
  const form = cuOpen === forId ? `<div class="custom" style="border-left-color:var(--navy)"><div class="q-head"><h3 style="font-size:16px;color:var(--navy)">Add a custom item to ${esc(q ? q.t : r.name)}</h3></div>

      ${cuMode === 'now' ? `<div class="grid" style="margin-top:10px">
          <div><label class="f">Customer price ($)</label><input type="number" id="cuPrice" min="0" step="1"></div>
          ${staff ? `<div><label class="f">Our cost ($)</label><input type="number" id="cuCost" min="0" step="1"></div>
          <div><label class="f">Cost code</label><select id="cuCode">${Object.entries(CODE_NAMES).map(([c,n])=>`<option value="${c}">${c} — ${n}</option>`).join('')}</select></div>` : ''}</div>`
        : `<div style="margin-top:10px;max-width:320px"><label class="f">Who should price it</label><select id="cuAsk">${TEAM.map(p=>`<option value="${esc(p.uid)}">${esc(p.name)}</option>`).join('')}</select>
           <div class="q-sub">They get a notice on their hub bell that this item needs a price. The sheet can't be confirmed until it has one.</div></div>`}
      <div style="margin-top:12px;display:flex;gap:8px"><button type="button" class="btn primary" id="cuAdd">Add it</button><button type="button" class="btn" id="cuCancel">Cancel</button></div></div>`
    : `<button type="button" class="addbtn noprint" data-cuopen="${esc(forId)}"><b>+</b> Add a custom item${q ? ' for ' + esc(q.t) : ''}</button>`;
  return items + form;
}

async function docPdf(btn, name){
  btn.disabled = true; const was = btn.textContent; btn.textContent = 'Making the PDF…';
  try{
    if(typeof html2pdf === 'undefined') await new Promise((res, rej)=>{ const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
    /* The PDF is a picture of the sheet cut into letter pages. Cut blindly, a line (or the totals) can land across two pages, so a
       copy is laid out at a fixed width first and a gap is put in front of anything that would cross a page edge; a section heading
       moves with its first line. The page is scrolled to the top first (a scrolled page left a blank band at the top). */
    const M = [0.45, 0.4, 0.55, 0.4], S = 2, W = Math.floor((8.5 - M[1] - M[3]) * 96);   // margins (in): top, left, bottom, right; W = the page's width in px
    const pageH = Math.floor(W * S * (11 - M[0] - M[2]) / (8.5 - M[1] - M[3])) / S;     // one page of content, in px at width W
    window.scrollTo(0, 0);
    const holder = document.createElement('div'); holder.style.cssText = 'position:absolute;left:-12000px;top:0;width:' + W + 'px;background:#fff';
    const el = document.getElementById('quoteDoc').cloneNode(true); el.id = 'quoteDocPdf';
    el.style.cssText = 'box-shadow:none;max-width:none;margin:0;width:' + W + 'px;padding:8px 24px;border-radius:0';
    holder.appendChild(el); document.body.appendChild(holder);
    const topOf = x=>x.getBoundingClientRect().top - el.getBoundingClientRect().top, bottomOf = x=>x.getBoundingClientRect().bottom - el.getBoundingClientRect().top;
    for(const b of [...el.querySelectorAll('.doc-head, .doc-facts, h3, tr, .doc-total, .doc-fine')]){
      let top = topOf(b), bottom = bottomOf(b);
      if(b.tagName === 'H3'){ const first = b.nextElementSibling && b.nextElementSibling.querySelector('tr'); if(first) bottom = bottomOf(first); top -= 14; }
      const page = Math.floor(top / pageH);
      if(Math.floor((bottom - 1) / pageH) === page || bottom - top >= pageH) continue;
      const gap = (page + 1) * pageH - top;
      if(b.tagName === 'TR') [...b.cells].forEach(td=>{ td.style.paddingTop = (parseFloat(getComputedStyle(td).paddingTop) + gap) + 'px'; });   // (an extra row would upset the column widths)
      else { const sp = document.createElement('div'); sp.style.height = gap + 'px'; b.parentNode.insertBefore(sp, b); }
    }
    try{
      await html2pdf().set({ margin:M, filename:name, image:{ type:'jpeg', quality:.95 }, html2canvas:{ scale:S, useCORS:true, backgroundColor:'#ffffff', scrollX:0, scrollY:0 },
        jsPDF:{ unit:'in', format:'letter', orientation:'portrait' }, pagebreak:{ mode:[] } }).from(el).toPdf().get('pdf').then(pdf=>{
          const n = pdf.internal.getNumberOfPages();
          for(let i = 1; i <= n; i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(140); pdf.text('Page ' + i + ' of ' + n, 8.5 - M[3], 11 - 0.25, { align:'right' }); }
        }).save();
    } finally { holder.remove(); }
  } catch(err){ console.error(err); window.print(); }
  btn.disabled = false; btn.textContent = was;
}

/* ---------- the home's details (owner, 2026-10-19) ----------

const JOB_FIELDS = [['client','Buyer(s)','text'],['address','Address','text'],['phone','Phone','tel'],['email','Email','email'],['filesUrl','OneDrive folder link','url'],

}
const jobMissing = j=>j ? JOB_FIELDS.filter(([k])=>!String(j[k] || '').trim()).map(([, n])=>n) : null;
const addDays = (d, n)=>{ const [y, m, dd] = d.split('-').map(Number); const x = new Date(y, m - 1, dd + n); return iso(x); };
function homeDetails(L){

  const j = JOBS[L.houseId];

function codes(L){
  const by = {};
  const put = (cc, price, cost)=>{ by[cc] = by[cc] || { price:0, cost:0 }; by[cc].price += price; by[cc].cost += cost; };
  lines(L).forEach(l=>put(l.q.cc, l.price, l.cost));
  L.custom.forEach(c=>put(c.cc, c.price, c.cost));
  L.cos.forEach(c=>put(c.cc, c.price, c.cost));
  if(L.cos.length) put(90, L.cos.length * CO_FEE, 0);
  const rows = Object.entries(by).filter(([,v])=>v.price || v.cost).sort((a,b)=>a[0]-b[0]);
  const tp = rows.reduce((s,[,v])=>s+v.price,0), tc = rows.reduce((s,[,v])=>s+v.cost,0);
  return `<div class="banner staff"><p><strong>Upgrades by cost code.</strong> The "our cost" column is what this sheet adds to the home's budget, on top of the base budget for the model. The price column is what it adds to the settlement.</p></div>
    <div class="card"><table><thead><tr><th>Code</th><th>Section</th><th class="num">Adds to settlement</th><th class="num">Adds to budget</th><th class="num">Margin</th></tr></thead><tbody>
      ${rows.map(([cc,v])=>`<tr><td class="mono">${cc}</td><td>${esc(CODE_NAMES[cc] || '')}</td><td class="num">${money(v.price)}</td><td class="num">${money(v.cost)}</td><td class="num">${money(v.price - v.cost)}</td></tr>`).join('')}
      <tr class="tot"><td colspan="2">Total</td><td class="num">${money(tp)}</td><td class="num">${money(tc)}</td><td class="num">${money(tp - tc)}</td></tr>
    </tbody></table></div>`;
}

    const a = L.answers[k] || { qty:0, price: box ? Math.max(0, Math.round(Number(box.value) || 0)) : choicePrice(q, Number(k.split('#')[1]), L) };     // the price is fixed the moment it's first picked
    markOwn(L, q); delete a.auto;
    if((q.ceil || q.opts || q.one) && tg && !a.qty) q.c.forEach((x, j)=>{ if(q.id + '#' + j !== k) delete L.answers[q.id + '#' + j]; });
    if(c.grp && tg && !a.qty) q.c.forEach((x, j)=>{ if(x.grp === c.grp && q.id + '#' + j !== k) delete L.answers[q.id + '#' + j]; });
    a.qty = tg ? (a.qty ? 0 : 1) : Math.max(0, Math.min(99, a.qty + Number(stp.dataset.d)));

  const fav = t.closest('[data-fav]'); if(fav){ e.stopPropagation(); L.favs[fav.dataset.fav] = !L.favs[fav.dataset.fav]; if(!L.favs[fav.dataset.fav]) delete L.favs[fav.dataset.fav]; render(); return; }
  const pick = t.closest('[data-pick]');

    else { const k = e.target.dataset.btNum, q = qOfKey(k), c = q && q.c[Number(k.split('#')[1])]; if(!c) return; markOwn(L1, q);

      if(c.grp && Number(e.target.value) > 0) q.c.forEach((x, j)=>{ if(x.grp === c.grp && q.id + '#' + j !== k) delete L1.answers[q.id + '#' + j]; });
      const v = Math.max(0, Math.min(99999, Math.round(Number(e.target.value) || 0)));

/* ---------- start ----------
   The office signs in with their hub login; the price list, every lead and the team come from the server in one go.
   A customer screen / their pricing sheet / the share page opens with the sheet's link key instead (no sign-in). */
let DEVS_SEEN = false;
function applySetup(data){
  buildCatalog(data.catalog || []);
  STYLE_CFG = data.styles || {}; ALLOW_CFG = data.allow || {}; CEIL_CFG = data.ceil || {}; OPT_PRICES = data.prices || {};
}
function loginScreen(msg){
  document.body.classList.add('signedout');
  $('totalbar').style.display = 'none';
  $('root').innerHTML = `<div class="card login"><img src="icons/logo.png" alt="Alden Homes" style="height:56px">
    <h2 style="margin-top:12px">Selections</h2><p class="lede" style="margin-top:4px">Sign in with your hub login.</p>
    <label class="f" style="margin-top:14px">Email</label><input type="text" id="loginEmail" autocomplete="username">
    <label class="f" style="margin-top:10px">Password</label><input type="password" id="loginPass" autocomplete="current-password">
    <div class="err" id="loginErr">${esc(msg || '')}</div>
    <button type="button" class="btn primary" id="loginGo" style="width:100%;margin-top:4px">Sign in</button>
    <p class="muted" style="font-size:13px;margin-top:16px">Customer screen? <a href="#" id="showJoin">Join with a code</a></p></div>
    <div class="card noprint" id="joinCard" style="max-width:400px;margin:14px auto 0;display:none"><h2>Join as customer screen</h2><p class="muted" style="font-size:14px;margin-top:4px">Type the code shown on the rep's device.</p>
      <div style="display:flex;gap:10px;margin-top:10px"><input type="tel" inputmode="numeric" id="joinCode" placeholder="000000" maxlength="6" autocomplete="off" style="flex:1;font-family:'Courier New',monospace;font-size:22px;letter-spacing:4px;text-align:center"><button type="button" class="btn primary" id="joinBtn">Join</button></div></div>`;
}
document.addEventListener('click', e=>{ if(e.target.closest('#showJoin')){ e.preventDefault(); const c = $('joinCard'); if(c){ c.style.display = ''; $('joinCode').focus(); } } });
function doLogin(){
  const email = ($('loginEmail').value || '').trim(), pass = $('loginPass').value || '';
  if(!email || !pass){ $('loginErr').textContent = 'Enter your email and password.'; return; }
  firebase.auth().signInWithEmailAndPassword(email, pass).catch(err=>{
    $('loginErr').textContent = ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(err.code) ? 'Email or password is incorrect.' : 'Sign-in failed: ' + err.message; });
}
// the lots the office has listed (Available Lots on the schedule page) and the developments they're in
async function loadLots(){
  try{
    const snap = await firebase.firestore().collection('available-lots').get();
    LOTS = snap.docs.map(d=>d.data()).filter(l=>l.lot).map(l=>({ dev:String(l.community || '').toUpperCase(), lot:String(l.lot), addr:l.address || '' }))
      .sort((a, b)=>a.dev.localeCompare(b.dev) || String(a.lot).localeCompare(String(b.lot), undefined, { numeric:true }));
    LOTS.forEach(l=>{ if(l.dev && !DEVS.some(d=>d.code === l.dev)) DEVS.push({ code:l.dev, name:l.dev }); });
  } catch(err){ console.warn('lots', err); }
}
async function bootOffice(){
  $('root').innerHTML = '<div class="card" style="margin-top:60px;text-align:center"><h2>Opening…</h2></div>';
  let data;
  try{ data = await selApi({ action:'boot' }); }
  catch(err){ console.error(err); $('root').innerHTML = '<div class="card" style="margin-top:60px;text-align:center"><h2>The selections couldn\'t be loaded.</h2><p class="lede" style="margin:8px auto 0">Check the connection and reload the page.</p></div>'; return; }
  applySetup(data);
  TEAM = data.team || [];
  (data.sheets || []).forEach(x=>{ KEYS[x.id] = x.key; REMOTE[x.id] = { rev:x.rev, sheet:clone(x.sheet) }; });
  leads = (data.sheets || []).map(x=>norm(clone(x.sheet)));
  try{ const homes = leads.filter(l=>l.houseId).map(l=>l.houseId);
    for(let i = 0; i < homes.length; i += 10){ const snap = await firebase.firestore().collection('jobs').where(firebase.firestore.FieldPath.documentId(), 'in', homes.slice(i, i + 10)).get(); snap.docs.forEach(d=>{ JOBS[d.id] = d.data(); }); } }
  catch(err){ console.warn('homes', err); }
  await loadLots();
  const want = new URLSearchParams(location.search).get('open');
  if(want && leads.some(l=>l.id === want)){ cur = want; const o = lead(); tab = o.stage === 'v1' ? 'v1' : o.stage === 'signed' ? 'sign' : 'full'; roomId = tab === 'full' ? ROOMS[0].id : 'lot'; }
  start();
  // the hub's search button and voice assistant, as on every staff page
  ['hubsearch.js', 'assistant.js'].forEach(f=>{ const sc = document.createElement('script'); sc.src = f; document.body.appendChild(sc); });
}
async function boot(){
  const linkId = PRESENT || SHOW || QUOTE;
  if(linkId){
    document.body.classList.add('public');
    $('root').innerHTML = '<div class="wrap"><div class="card" style="margin-top:60px;text-align:center"><h2>Opening…</h2></div></div>';
    try{ applySetup(await selApi({ action:'catalog', id:linkId })); }
    catch(e){ $('totalbar').style.display = 'none'; $('root').innerHTML = `<div class="wrap"><div class="card" style="margin-top:60px;text-align:center"><h2>This link isn't active.</h2><p class="lede" style="margin:8px auto 0">Ask your Alden Homes rep to share it again.</p></div></div>`; return; }
    start();
    return;
  }
  firebase.initializeApp(firebaseConfig);
  let started = false;
  firebase.auth().onAuthStateChanged(user=>{
    if(user && !user.isAnonymous){
      document.body.classList.remove('signedout');
      $('currentUserEmail').textContent = user.email || '';
      if(!started){ started = true; bootOffice(); }
    } else { started = false; loginScreen(); }
  });
}
function start(){
  load();
  if(SHOW){ loadShow(); return; }
  if(QUOTE){ loadShared(QUOTE, st=>{ quoteState = st; }); return; }
  render();
}
/* Signed: the home is made (or found by development + lot) in Active Homes, and its sale price set from this sheet. */
async function makeHome(L){
  if(!(await flush())){ toast('Still saving. Try "Add the home" again in a moment.'); render(); return; }
  const saleLines = [{ bt:'', title:'Base price', choice:L.model || '', price:base(L) },
    ...lines(L).filter(l=>!l.typed).map(l=>({ bt:l.q.bt || '', title:l.q.t, choice:l.label, price:l.price })),
    ...L.custom.filter(c=>!c.pending).map(c=>({ bt:'', title:'Custom item', choice:c.desc, price:c.price }))];
  try{
    const r = await selApi({ action:'sign', id:L.id, sale:{ price: base(L) + upgrades(L), lines: saleLines } });
    L.houseId = r.houseId; if(REMOTE[L.id]) REMOTE[L.id].sheet.houseId = r.houseId; if(sync.last) sync.last.houseId = r.houseId;
    toast(r.created ? 'The home is in Active Homes now, with its sale price' : 'The sale price is on the home in Active Homes');
  } catch(err){ console.error(err); toast('The sheet is signed, but the home couldn\'t be added yet. Press "Add the home" to try again.'); }
  render();
}
