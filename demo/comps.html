<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alden Homes — Historic Costs</title>
<style>
  :root{
    --ink:#1a1d21;--ink-soft:#4a5158;--line:#dfe3e8;--line-soft:#eef1f4;
    --paper:#f7f8fa;--card:#ffffff;--brand:#1f5c4d;--brand-soft:#e7f0ed;
    --over:#b23b3b;--over-soft:#fbecec;--under:#1f7a4d;--under-soft:#e7f4ec;
    --warn:#a86a1a;--warn-soft:#faf1e0;--accent:#2b6cb0;--accent-soft:#e8f1fb;
    --radius:8px;--mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:14px;line-height:1.45}
  h1,h2,h3{margin:0;font-weight:600}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:inherit}
  .mono{font-family:var(--mono)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .muted{color:var(--ink-soft)}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600}

  header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
  .logo{font-weight:700;letter-spacing:.02em;font-size:16px}.logo span{color:var(--brand)}
  .grow{flex:1}
  .pill{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--brand-soft);color:var(--brand);font-weight:600}
  main{max-width:1280px;margin:0 auto;padding:20px}

  .searchbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .searchbar select,.searchbar input{padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .searchbar select:focus,.searchbar input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .searchbar .big{font-size:15px;font-weight:600;min-width:220px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
  .card-h{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:12px}
  .card-h h2{font-size:15px}
  .card-b{padding:0}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:600}
  .kpi .val{font-size:22px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
  .kpi .sub{font-size:11px;color:var(--ink-soft);margin-top:3px}

  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
  th.num,td.num{text-align:right}
  td{padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
  tbody tr:hover{background:var(--line-soft)}
  .sticky-col{position:sticky;left:0;background:var(--card);z-index:2;box-shadow:1px 0 0 var(--line-soft)}
  tbody tr:hover .sticky-col{background:var(--line-soft)}
  .row-head{font-weight:600}
  .yr-old{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:6px}
  .yr-fresh{background:var(--under-soft);color:var(--under)}
  .yr-aging{background:var(--warn-soft);color:var(--warn)}
  .yr-stale{background:var(--over-soft);color:var(--over)}
  .avg-row td{background:var(--brand-soft);font-weight:700;border-top:2px solid var(--brand)}
  .avg-row .sticky-col{background:var(--brand-soft)}
  .heat0{color:var(--ink-soft)} .heat1{} .heat2{font-weight:600} .heat3{font-weight:700;color:var(--over)}

  .seed{background:#20242a;color:#e8e6df;border-radius:var(--radius);padding:18px;margin-bottom:16px}
  .seed h3{color:#fff;font-size:15px;margin-bottom:4px}
  .seed p{color:#a8adb3;font-size:13px;margin:0 0 14px}
  .seed-opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .seed-btn{background:#2f3238;color:#c7c9cc;border:1px solid #45484e;border-radius:6px;padding:8px 13px;font-weight:600;font-size:13px}
  .seed-btn:hover{border-color:#5a5e65}
  .seed-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .seed-table{width:100%;border-collapse:collapse;font-size:13px}
  .seed-table th{color:#8b9098;border-bottom:1px solid #363b42;background:none;position:static}
  .seed-table td{border-bottom:1px solid #2b3037;color:#dcdedf;white-space:nowrap}
  .seed-table td.num,.seed-table th.num{font-family:var(--mono)}
  .seed-total td{border-top:2px solid #454b53;font-weight:700;color:#fff;border-bottom:none}
  .seed-note{font-size:12px;color:#8b9098;margin-top:10px}

  .empty{padding:50px;text-align:center;color:var(--ink-soft)}
  .btn{background:var(--brand);color:#fff;border:1px solid var(--brand);padding:8px 14px;border-radius:6px;font-weight:600}
  .btn.ghost{background:none;color:var(--brand)}.btn.ghost:hover{background:var(--brand-soft)}
  .btn.sm{padding:6px 11px;font-size:13px}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<header>
  <div class="logo">ALDEN<span>·</span>HUB</div>
  <a href="index.html" style="color:var(--ink-soft);text-decoration:none;font-size:13px;font-weight:600">Hub</a>
  <span class="muted" style="font-size:13px">Historic Costs</span>
  <div class="grow"></div>

<main>

    <div class="grow"></div>
    <span class="muted" id="date-range" style="font-size:12px"></span>
  </div>
  <div id="body"></div>
</main>

<script>
/* ============================================================
   Alden Homes — Historic Cost Comp Engine
   Data: 136 completed houses (2022–2026), section costs from the
   Job Cost Spreadsheet. Search a model see every build lined up
   by section, normalize by $/sqft, seed a new house's budget.
   State declared first (TDZ-safe).
   ============================================================ */
let selModel="", selComm="ALL", normMode="dollars", seedMethod="avg";

const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const money=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString("en-US");
const money2=n=>"$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const anchor=new Date("2026-08-01");
function monthsOld(d){const x=new Date(d);return (anchor.getFullYear()-x.getFullYear())*12+(anchor.getMonth()-x.getMonth());}
function yrClass(m){return m<=12?"yr-fresh":(m<=30?"yr-aging":"yr-stale");}
function yrLabel(m){return m<12?m+"mo":(Math.round(m/12*10)/10)+"yr";}

/* base models sorted by comp count desc */
function baseModels(){
  const m={};
  COMPS.forEach(c=>{m[c.base]=(m[c.base]||0)+1;});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([name,n])=>({name,n}));
}
function communitiesFor(model){
  const s=new Set(COMPS.filter(c=>c.base===model).map(c=>c.comm).filter(Boolean));
  return [...s].sort();
}
function compsFor(model,comm){
  return COMPS.filter(c=>c.base===model && (comm==="ALL"||c.comm===comm))
    .sort((a,b)=>a.date.localeCompare(b.date));
}
function secVal(c,col){const v=c.sec[col];return typeof v==="number"?v:0;}

/* ---------- render ---------- */
function render(){
  $("#comp-count").textContent=COMPS.length+" completed builds";
  // model dropdown
  const ms=baseModels();
  if(!selModel) selModel=ms[0].name;
  $("#model-select").innerHTML=ms.map(m=>`<option value="${m.name}">${m.name} (${m.n})</option>`).join("");
  $("#model-select").value=selModel;
  // community filter
  const comms=communitiesFor(selModel);
  $("#comm-filter").innerHTML=`<option value="ALL">All communities</option>`+comms.map(c=>`<option value="${c}">${c}</option>`).join("");
  if(selComm!=="ALL" && !comms.includes(selComm)) selComm="ALL";
  $("#comm-filter").value=selComm;
  $("#norm-select").value=normMode;

  const rows=compsFor(selModel,selComm);
  if(!rows.length){$("#body").innerHTML=`<div class="empty">No builds found for ${selModel}.</div>`;return;}

  const dates=rows.map(r=>r.date).sort();
  $("#date-range").textContent=`${rows.length} builds · ${dates[0]} ${dates[dates.length-1]}`;

  // KPIs
  const totals=rows.map(r=>r.total), csfs=rows.map(r=>r.csf).filter(Boolean), gps=rows.map(r=>r.gp).filter(v=>typeof v==="number");
  const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
  const newest=rows[rows.length-1];
  $("#body").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="lbl">Builds on record</div><div class="val">${rows.length}</div><div class="sub">${selComm==="ALL"?"all communities":selComm}</div></div>
      <div class="kpi"><div class="lbl">Avg total cost</div><div class="val">${money(avg(totals))}</div><div class="sub">range ${money(Math.min(...totals))}–${money(Math.max(...totals))}</div></div>
      <div class="kpi"><div class="lbl">Avg cost / sq ft</div><div class="val">$${Math.round(avg(csfs))}</div><div class="sub">newest ${money(newest.total)} @ $${newest.csf}/sf</div></div>
      <div class="kpi"><div class="lbl">Avg gross profit</div><div class="val">${gps.length?Math.round(avg(gps)*100)+"%":"—"}</div><div class="sub">most recent ${newest.date}</div></div>
    </div>
    ${seedPanel(rows)}
    <div class="card">
      <div class="card-h"><h2>${selModel} — builds by section</h2>
        <span class="muted" style="font-size:12.5px">${normMode==="persqft"?"$ per sq ft":"total $"} · oldest newest</span>
        <div class="grow"></div></div>
      <div class="card-b"><div class="scroll">${compTable(rows)}</div></div>
    </div>`;
  wireSeed(rows);
}

/* the lined-up section table — sections as rows, builds as columns */
function compTable(rows){
  const per = normMode==="persqft";
  const fmt = per ? (v,sf)=> sf? money2(v/sf) : "—" : (v)=>v?money(v):"—";
  // build header: each build a column
  const head=`<tr>
    <th class="sticky-col">Section</th>
    ${rows.map(r=>{const m=monthsOld(r.date);return `<th class="num">${r.comm} ${r.lot}<br><span class="muted" style="font-weight:400">${r.date.slice(0,7)}</span> <span class="yr-old ${yrClass(m)}">${yrLabel(m)}</span></th>`;}).join("")}
    <th class="num" style="background:var(--brand-soft)">Average</th>
  </tr>`;
  // section rows
  const secRows=SECTION_COLS.map(col=>{
    const vals=rows.map(r=>secVal(r,col));
    if(vals.every(v=>!v)) return "";
    const avg=vals.reduce((s,v)=>s+v,0)/vals.length;
    const cells=rows.map((r,i)=>{
      const v=vals[i], sf=r.sqft;
      return `<td class="num">${fmt(v,sf)}</td>`;
    }).join("");
    const avgSf=rows.reduce((s,r)=>s+r.sqft,0)/rows.length;
    return `<tr><td class="sticky-col row-head">${col}</td>${cells}<td class="num" style="background:var(--brand-soft);font-weight:700">${per?money2(avg/avgSf):money(avg)}</td></tr>`;
  }).filter(Boolean).join("");
  // totals row
  const totCells=rows.map(r=>`<td class="num">${per?money2(r.total/r.sqft):money(r.total)}</td>`).join("");
  const avgTot=rows.reduce((s,r)=>s+r.total,0)/rows.length;
  const avgSf=rows.reduce((s,r)=>s+r.sqft,0)/rows.length;
  const sqftRow=`<tr><td class="sticky-col row-head">Conditioned sq ft</td>${rows.map(r=>`<td class="num">${r.sqft.toLocaleString()}</td>`).join("")}<td class="num" style="background:var(--brand-soft)">${Math.round(avgSf).toLocaleString()}</td></tr>`;
  const totRow=`<tr class="avg-row"><td class="sticky-col">TOTAL</td>${totCells}<td class="num">${per?money2(avgTot/avgSf):money(avgTot)}</td></tr>`;
  return `<table>${head}${sqftRow}${secRows}${totRow}</table>`;
}

/* ---------- budget-seed chooser ---------- */
function seedPanel(rows){
  const methods=[
    ["avg","Average of all builds"],
    ["recent","Most recent build"],
    ["recent3","Average of last 3"],
    ["sqft","Same sq ft (cost/sf × new sqft)"],
  ];
  return `<div class="seed">
    <h3>Seed a new house budget from these comps</h3>
    <p>Pick how to turn ${rows.length} historic ${selModel} builds into a starting budget by section. This is what feeds the job-costing app; he can still adjust any line after.</p>
    <div class="seed-opts">${methods.map(([k,l])=>`<button class="seed-btn ${seedMethod===k?'active':''}" data-seed="${k}">${l}</button>`).join("")}</div>
    <div id="seed-out"></div>
  </div>`;
}

function computeSeed(rows,method){
  const per=SECTION_COLS.map(col=>{
    const vals=rows.map(r=>secVal(r,col));
    let v=0, note="";
    if(method==="avg"){v=vals.reduce((s,x)=>s+x,0)/vals.length;}
    else if(method==="recent"){v=vals[vals.length-1];}
    else if(method==="recent3"){const last=vals.slice(-3);v=last.reduce((s,x)=>s+x,0)/last.length;}
    else if(method==="sqft"){
      // cost/sf per build for this section, averaged, × target sqft (use newest sqft as target)
      const target=rows[rows.length-1].sqft;
      const csf=rows.map(r=>r.sqft?secVal(r,col)/r.sqft:0);
      const avgCsf=csf.reduce((s,x)=>s+x,0)/csf.length;
      v=avgCsf*target; note=`$${(Math.round(avgCsf*100)/100)}/sf × ${target}`;
    }
    return {col,v,note};
  }).filter(x=>x.v>0);
  const total=per.reduce((s,x)=>s+x.v,0);
  return {per,total};
}

function wireSeed(rows){
  const out=$("#seed-out");
  function draw(){
    const {per,total}=computeSeed(rows,seedMethod);
    out.innerHTML=`<table class="seed-table">
      <thead><tr><th>Section</th><th class="num">Seeded budget</th>${seedMethod==="sqft"?'<th>Basis</th>':''}</tr></thead>
      <tbody>${per.map(p=>`<tr><td>${p.col}</td><td class="num">${money(p.v)}</td>${seedMethod==="sqft"?`<td class="muted">${p.note}</td>`:''}</tr>`).join("")}
        <tr class="seed-total"><td>Seeded total</td><td class="num">${money(total)}</td>${seedMethod==="sqft"?'<td></td>':''}</tr>
      </tbody></table>
      <div class="seed-note">In the live suite this writes to the new house's <span class="mono">budget</span> map (by cost code), which the job-costing app reads for budget-vs-actual. As real invoices close this house out, its actuals become a new comp row here.</div>`;
  }
  draw();
  $$("[data-seed]").forEach(b=>b.onclick=()=>{seedMethod=b.dataset.seed;$$("[data-seed]").forEach(x=>x.classList.toggle("active",x===b));draw();});
}

/* ---------- init ---------- */
function init(){
  render();
  $("#model-select").onchange=e=>{selModel=e.target.value;selComm="ALL";render();};
  $("#comm-filter").onchange=e=>{selComm=e.target.value;render();};
  $("#norm-select").onchange=e=>{normMode=e.target.value;render();};
}
init();
</script>
</body>
</html>
