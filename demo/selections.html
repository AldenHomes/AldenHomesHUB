<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alden Homes | Selections (demo)</title>
<style>
  :root{
    --navy:#4B4F54; --navy-2:#33363a; --line:#d4d2c8; --line-soft:#ece8dd; --paper:#f5f4ef; --paper-2:#ffffff;
    --ink:#33363a; --ink-soft:#6b6f72; --sage:#A3AA83; --sage-2:#6B7355; --sage-soft:#eef0e8; --amber:#c98a2b; --amber-soft:#fdf3e2;
    --red:#a94438; --red-soft:#fbeae4; --good:#3f7a4e; --good-soft:#eaf1ec; --staff:#4a6b8a; --staff-soft:#e9eff5;
    --shadow:0 1px 2px rgba(30,32,34,.08),0 4px 14px rgba(30,32,34,.06); --radius:8px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;padding-bottom:96px}
  h1,h2,h3,p{margin:0}
  button,input,select,textarea{font-family:inherit;font-size:inherit}
  button{cursor:pointer}
  .mono{font-family:"Courier New",monospace}
  .muted{color:var(--ink-soft)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(12px,3vw,28px)}

  .top{background:var(--paper-2);border-bottom:4px solid var(--sage);position:sticky;top:0;z-index:50}
  .top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0}
  .logo{font-weight:800;letter-spacing:.5px;color:var(--navy)}
  .logo span{color:var(--sage-2)}
  .top a{color:var(--ink-soft);text-decoration:none;font-size:13px;font-weight:600}
  .grow{flex:1}
  .pill{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:var(--amber-soft);color:#8a5d14;border-radius:20px;padding:4px 10px}
  .viewsw{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
  .viewsw button{border:none;background:none;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink-soft)}
  .viewsw button.on{background:var(--navy);color:#fff}
  .viewsw button.on.staff{background:var(--staff)}

  .btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:var(--radius);padding:10px 16px;font-weight:700;font-size:14.5px}
  .btn:hover{border-color:var(--navy)}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.good{background:var(--good);border-color:var(--good);color:#fff}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn:disabled{opacity:.45;cursor:default}
  .card{background:var(--paper-2);box-shadow:var(--shadow);border-radius:var(--radius);padding:18px 20px;margin-top:16px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--sage-2)}
  h1{font-size:26px;color:var(--navy);margin-top:4px}
  h2{font-size:18px;color:var(--navy)}
  .lede{color:var(--ink-soft);margin-top:6px;line-height:1.5;max-width:760px}
  label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
  input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
  .chip.v1{background:var(--amber-soft);color:#8a5d14}
  .chip.v2{background:var(--staff-soft);color:var(--staff)}
  .chip.signed{background:var(--good-soft);color:var(--good)}
  .chip.red{background:var(--red-soft);color:var(--red)}
  .chip.plain{background:var(--sage-soft);color:var(--sage-2)}

  /* leads list */
  .lead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line-soft)}
  .lead:first-child{border-top:none}
  .lead .who{flex:1 1 240px;min-width:0}
  .lead .who strong{font-size:16px;color:var(--navy)}
  .lead .amt{font-family:"Courier New",monospace;font-weight:700;color:var(--navy);min-width:110px;text-align:right}

  /* tabs */
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:16px;border-bottom:2px solid var(--line)}
  .tab{border:none;background:none;padding:10px 14px;font-weight:700;font-size:14.5px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab.on{color:var(--navy);border-bottom-color:var(--sage-2)}
  .tab.staff{color:var(--staff)}
  .tab.staff.on{border-bottom-color:var(--staff)}
  .tab .n{font-size:11px;background:var(--red-soft);color:var(--red);border-radius:10px;padding:1px 7px;margin-left:5px}

  /* rooms layout */
  .rooms{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;margin-top:16px;align-items:start}
  @media (max-width:820px){ .rooms{grid-template-columns:1fr} .roomnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:static!important} .roomnav button{flex:none;width:auto;min-width:150px;background:var(--paper-2);border-color:var(--line-soft)} }
  .roomnav{position:sticky;top:76px}
  .roomnav button{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:var(--radius);padding:9px 11px;margin-bottom:4px;color:var(--ink)}
  .roomnav button.on{background:var(--paper-2);border-color:var(--line);box-shadow:var(--shadow)}
  .roomnav .rn{font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
  .roomnav .rp{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .roomnav .done{color:var(--good)}
  .roomnav .bar{height:4px;background:var(--line-soft);border-radius:2px;margin-top:6px;overflow:hidden}
  .roomnav .bar span{display:block;height:100%;background:var(--sage-2)}
  .deadline{font-size:12.5px;background:var(--amber-soft);color:#8a5d14;border-radius:6px;padding:7px 10px;margin-top:10px;display:inline-block}

  /* questions */
  .q{background:var(--paper-2);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px 18px;margin-top:14px}
  .q.todo{border-left:4px solid var(--amber)}
  .q-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .q-head h3{font-size:16.5px;color:var(--navy)}
  .q-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  .opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:12px}
  .opt{position:relative;text-align:left;border:2px solid var(--line);background:#fff;border-radius:var(--radius);padding:0;overflow:hidden;color:var(--ink)}
  .opt:hover{border-color:var(--sage)}
  .opt.sel{border-color:var(--good);box-shadow:0 0 0 2px var(--good-soft)}
  .opt:disabled{cursor:default;opacity:.85}
  .opt .art{height:78px;background:#f7f6f1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .opt .art svg{width:100%;height:100%}
  .opt .txt{padding:9px 11px 10px}
  .opt .nm{font-weight:700;font-size:14px;line-height:1.3}
  .opt .pr{font-size:13px;margin-top:3px;font-family:"Courier New",monospace;font-weight:700;color:var(--navy)}
  .opt .pr.inc{color:var(--good);font-family:inherit}
  .opt .std{position:absolute;top:6px;left:6px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:rgba(255,255,255,.92);color:var(--good);border-radius:4px;padding:2px 6px}
  .opt .tick{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;font-size:13px;display:none;align-items:center;justify-content:center}
  .opt.sel .tick{display:flex}
  .opt .fav{position:absolute;bottom:6px;right:8px;font-size:17px;color:#c9c4b5;line-height:1}
  .opt .fav.on{color:var(--red)}
  .staffline{font-size:11.5px;color:var(--staff);background:var(--staff-soft);border-radius:4px;padding:3px 6px;margin-top:6px;line-height:1.4}
  .eachrow{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-soft)}
  .eachrow:first-of-type{border-top:none;padding-top:0}
  .eachrow .rm{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft)}
  .qty{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
  .stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
  .stepper button{border:none;background:#fff;width:44px;height:44px;font-size:22px;color:var(--navy)}
  .stepper button:disabled{opacity:.3}
  .stepper span{min-width:48px;text-align:center;font-weight:700;font-size:18px}
  .changed{font-size:12.5px;background:var(--amber-soft);color:#8a5d14;border-radius:6px;padding:6px 10px;margin-top:10px;display:inline-block}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);padding:8px 8px;border-bottom:2px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  .num{text-align:right;font-family:"Courier New",monospace;white-space:nowrap}
  tr.tot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
  tr.grp td{background:#faf8f2;font-weight:700;color:var(--navy);font-size:13px}
  td.st, th.st{color:var(--staff)}

  .banner{border-radius:var(--radius);padding:14px 16px;margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .banner.amber{background:var(--amber-soft);border:1px solid #ecd9b0;color:#6e4a10}
  .banner.good{background:var(--good-soft);border:1px solid #c5dccb;color:#27573a}
  .banner.staff{background:var(--staff-soft);border:1px solid #c9d8e6;color:#2c4a66}
  .banner p{flex:1 1 280px;line-height:1.45;font-size:14.5px}

  .totalbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper-2);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(30,32,34,.08);z-index:40}
  .totalbar .in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0}
  .totalbar .big{font-family:"Courier New",monospace;font-size:24px;font-weight:700;color:var(--navy)}
  .totalbar .sub{font-size:12.5px;color:var(--ink-soft)}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--navy-2);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
  .toast.show{opacity:1}
  /* the customer's own screen: bigger, nothing but their choices */
  body.present{font-size:18px}
  body.present .opts{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  body.present .opt .art{height:130px}
  body.present .opt .nm{font-size:17px}
  body.present .opt .pr{font-size:16px}
  body.present .q-head h3{font-size:21px}
  body.present .q{padding:20px 22px}
  body.present #viewSw, body.present .top a, body.present .pill{display:none}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--good)}
  .live i{width:9px;height:9px;border-radius:50%;background:var(--good);animation:livePulse 1.6s ease-in-out infinite}
  @keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(63,122,78,.5)}50%{box-shadow:0 0 0 7px rgba(63,122,78,0)}}
  .opt.flash{animation:optFlash 1.6s ease-out}
  @keyframes optFlash{0%{box-shadow:0 0 0 6px rgba(201,138,43,.75)}100%{box-shadow:0 0 0 2px var(--good-soft)}}
  .sharebox{background:var(--staff-soft);border:1px solid #c9d8e6;border-radius:var(--radius);padding:14px 16px;margin-top:14px;color:#2c4a66}
  .sharebox input{font-family:"Courier New",monospace;font-size:13px;margin-top:8px}
  /* the shareable selection sheet (?show=LEAD): no prices, made to be passed around */
  body.show{background:#fff;padding-bottom:0}
  body.show .top, body.show .totalbar{display:none!important}
  body.show #root{max-width:none;padding:0}
  .sh, .sh *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sh-hero{background:linear-gradient(155deg,#2b2e31 0%,#4B4F54 55%,#646b4e 100%);color:#fff;padding:40px 0 48px;text-align:center}
  .sh-logo{display:block;width:fit-content;margin:0 auto;background:#fff;border-radius:10px;padding:12px 22px}
  .sh-logo img{height:58px;display:block}
  .sh-kicker{letter-spacing:3.5px;text-transform:uppercase;font-size:12px;font-weight:700;color:#cfd3b8;margin-top:30px}
  .sh-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,7vw,62px);font-weight:700;line-height:1.05;margin-top:10px;color:#fff}
  .sh-sub{color:#e9ebdf;margin-top:14px;font-size:17px}
  .sh-stats{display:flex;justify-content:center;gap:clamp(22px,6vw,64px);flex-wrap:wrap;margin-top:32px}
  .sh-stat b{display:block;font-family:Georgia,serif;font-size:38px;line-height:1;color:#fff}
  .sh-stat span{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#cfd3b8;margin-top:7px}
  .sh-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .sh-actions button{border:none;border-radius:24px;padding:12px 22px;font-weight:700;font-size:15px;background:#fff;color:var(--navy)}
  .sh-actions button.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6)}
  .sh-sec{padding:40px 0 4px}
  .sh-sec h2{font-family:Georgia,serif;font-size:29px;color:var(--navy);display:flex;align-items:center;gap:14px}
  .sh-sec h2:after{content:"";flex:1;height:2px;background:var(--sage)}
  .sh-lede{color:var(--ink-soft);margin-top:8px;font-size:16px;max-width:680px;line-height:1.5}
  .sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-top:20px}
  .sh-grid.big{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .sh-tile{position:relative;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow);break-inside:avoid;page-break-inside:avoid}
  .sh-tile .art{height:118px;background:#f7f6f1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sh-grid.big .sh-tile .art{height:170px}
  .sh-tile .art svg{width:100%;height:100%}
  .sh-tile .art .count{font-family:Georgia,serif;font-size:56px;font-weight:700;color:var(--sage-2)}
  .sh-tile .txt{padding:12px 14px 14px}
  .sh-tile .lab{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--sage-2)}
  .sh-tile .val{font-size:17px;font-weight:700;color:var(--navy);line-height:1.25;margin-top:3px}
  .sh-grid.big .sh-tile .val{font-family:Georgia,serif;font-size:22px}
  .sh-tile .up{position:absolute;top:10px;left:10px;background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-radius:20px;padding:4px 10px}
  .sh-made{border-left:5px solid var(--sage);background:#faf8f2;border-radius:0 10px 10px 0;padding:16px 20px;margin-top:14px;font-family:Georgia,serif;font-size:20px;color:var(--navy);break-inside:avoid}
  .sh-cta{background:var(--sage-soft);border-top:4px solid var(--sage);margin-top:48px;padding:44px 0 50px;text-align:center}
  .sh-cta h2{font-family:Georgia,serif;font-size:clamp(26px,4.5vw,36px);color:var(--navy)}
  .sh-cta p{color:var(--ink-soft);margin-top:10px;font-size:17px}
  .sh-cta .who{margin-top:20px;font-weight:700;color:var(--navy);font-size:18px}
  .sh-foot{text-align:center;color:var(--ink-soft);font-size:12px;padding:16px 0 26px}
  .sharelink{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .sharelink input{flex:1 1 280px;font-family:"Courier New",monospace;font-size:13px}
  body.pdfing .noprint{display:none!important}
  @page{margin:0}
  /* office notes + follow-up on a lead (never shown to the customer) */
  .office{background:var(--staff-soft);border:1px solid #c9d8e6;border-radius:var(--radius);padding:16px 18px;margin-top:16px}
  .office h2{color:var(--staff);font-size:16px}
  .office-cols{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:12px}
  .office textarea{min-height:64px;resize:vertical}
  .note{background:#fff;border-radius:6px;padding:9px 11px;margin-top:8px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;display:flex;gap:8px}
  .note .when{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .note .x{border:none;background:none;color:var(--ink-soft);font-size:18px;line-height:1;padding:0 2px;align-self:flex-start}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip.due{background:var(--red-soft);color:var(--red)}
  .chip.soon{background:var(--amber-soft);color:#8a5d14}
  .chip.later{background:var(--staff-soft);color:var(--staff)}
  /* the Pricing meeting: the paper pricing sheet, one row per line */
  .prow{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line-soft)}
  .prow:first-child{border-top:none;padding-top:2px}
  .prow .pl{flex:1 1 220px;min-width:0}
  .prow .pt{font-weight:700;font-size:15px;color:var(--navy)}
  .prow .pn{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
  .prow .pc{flex:0 1 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .prow.long .pc{flex:1 1 100%}
  .segs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .seg{border:2px solid var(--line);background:#fff;border-radius:22px;padding:7px 13px;font-size:14px;font-weight:700;color:var(--ink);line-height:1.2;text-align:center}
  .seg small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-soft);font-family:"Courier New",monospace}
  .seg:hover{border-color:var(--sage)}
  .seg.on{border-color:var(--good);background:var(--good-soft);color:#27573a}
  .seg.on.dflt{border-color:var(--line);background:#f3f2ec;color:var(--ink-soft)}
  .seg:disabled{cursor:default;opacity:.8}
  .prow input[type=number]{width:104px;text-align:right}
  .prow input[type=text]{width:240px;max-width:100%}
  .prow textarea{width:100%;min-height:58px;resize:vertical}
  .prow .tot{font-family:"Courier New",monospace;font-weight:700;color:var(--navy);white-space:nowrap}
  .prow .stepper button{width:38px;height:38px;font-size:20px}
  .prow .stepper span{min-width:40px;font-size:16px}
  body.present .prow .pt{font-size:18px}
  body.present .seg{font-size:16px;padding:10px 16px}
  .sh-tile .art .noart{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef0e8,#dfe3d0);color:var(--sage-2);font-family:Georgia,serif;font-size:17px;font-weight:700;text-align:center;padding:10px}
  /* custom items: the + button on every section */
  .addbtn{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--line);background:none;border-radius:var(--radius);padding:10px 16px;font-weight:700;font-size:14.5px;color:var(--navy);margin-top:14px}
  .addbtn:hover{border-color:var(--navy)}
  .addbtn b{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;align-items:center;justify-content:center;font-size:17px;line-height:1}
  .custom{background:var(--paper-2);box-shadow:var(--shadow);border-radius:var(--radius);padding:14px 18px;margin-top:14px;border-left:4px solid var(--sage)}
  .custom.wait{border-left-color:var(--amber)}
  .custom .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .custom .row2 input[type=number]{width:120px}
  .radio2{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .radio2 label{display:flex;align-items:center;gap:7px;border:2px solid var(--line);border-radius:22px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;background:#fff}
  .radio2 input{accent-color:var(--navy)}
  /* the pricing sheet as a document: for review, for printing, for sending */
  .docbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:16px}

  const twins = {};                                   // a line with an MCC twin is the Alden one, even where it isn't labelled

   Once the office presses "Open customer screen", this sheet is also kept on the hub's server (a small helper
   made just for this demo). Every second each screen either sends what it changed or asks whether anything is

const SYNC_URL = 'https://us-central1-alden-homes-hub.cloudfunctions.net/demoSync';

  Object.keys((from && from.answers) || {}).forEach(k=>{ if(!(k in (to.answers || {}))) del.push(k); });
  SYNC_FIELDS.forEach(f=>{ if(!from || !same(from[f], to[f])) top[f] = to[f] === undefined ? null : to[f]; });

async function syncTick(){

  if(sync.busy) return;

  const L = lead(), sent = L ? clone(L) : null;

}
async function showPdf(btn){
  const L = lead(); if(!L) return;
  btn.disabled = true; const was = btn.textContent; btn.textContent = 'Making the PDF…';
  try{
    if(typeof html2pdf === 'undefined') await new Promise((res, rej)=>{ const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
    document.body.classList.add('pdfing');
    const toPng = (src, w, h)=>new Promise(res=>{ const im = new Image(); im.onload = ()=>{ const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h); res(c.toDataURL('image/png')); }; im.onerror = ()=>res(''); im.src = src; });
    for(const svg of Array.from(document.querySelectorAll('.sh .art svg'))){
      const box = svg.getBoundingClientRect(), w = Math.max(2, Math.round(box.width * 2)), h = Math.max(2, Math.round(box.height * 2));
      const copy = svg.cloneNode(true); copy.setAttribute('width', w); copy.setAttribute('height', h); copy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const png = await toPng('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(copy)), w, h);
      if(png){ const im = document.createElement('img'); im.src = png; im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block'; svg.replaceWith(im); }
    }
    const logo = document.querySelector('.sh-logo img');
    if(logo && logo.naturalWidth){ const png = await toPng(logo.src, logo.naturalWidth, logo.naturalHeight); if(png){ logo.src = png; await new Promise(r=>setTimeout(r, 50)); } }
    await html2pdf().set({ margin:0, filename:'The ' + familyName(L) + ' Home - Alden Homes selections.pdf', image:{ type:'jpeg', quality:.94 },
      html2canvas:{ scale:2, useCORS:true, backgroundColor:'#ffffff' }, jsPDF:{ unit:'in', format:'letter', orientation:'portrait' }, pagebreak:{ mode:['css','legacy'], avoid:['.sh-tile','.sh-made','.sh-sec h2'] } })
      .from(document.querySelector('.sh')).save();
  } catch(err){ console.error(err); window.print(); }   // if the PDF maker can't load, the browser's own "Save as PDF" still works
  document.body.classList.remove('pdfing');
  render();   // put the drawings back as they were
  const again = document.getElementById('shPdf'); if(again){ again.disabled = false; again.textContent = was; }
}

/* one question, in any of its forms */
function question(q, L, opts){
  if(!asked(q, L)) return '';
  if(q.opt) return prow(q, L);
  const staff = view === 'staff', lock = locked(L);
  const snap = L.v1Snap || {};
  const optCard = (key, o, i)=>{
    const a = L.answers[key], sel = a && a.label === o[0];
    const fav = L.favs[key + '|' + o[0]];
    // a sheet shows the price it was quoted at for the picked option, today's price for the others
    const price = sel ? a.price : o[1], cost = sel ? a.cost : o[2];
    return `<button type="button" class="opt ${sel?'sel':''}${sel && flashKey === key ? ' flash' : ''}" data-pick="${esc(key)}" data-opt="${esc(o[0])}" ${lock?'disabled':''}>
      <div class="art">${o[3] || ''}</div>${i === 0 ? '<span class="std">Standard</span>' : ''}<span class="tick">&#10003;</span>
      <div class="txt"><div class="nm">${esc(o[0])}</div>
        <div class="pr ${price === 0 ? 'inc' : ''}">${price === 0 ? (i === 0 ? 'Included' : 'No extra cost') : plus(price)}</div>
        ${staff && price ? `<div class="staffline">our cost ${money(cost)} · margin ${money(price - cost)}</div>` : ''}</div>
      ${!lock && !sel ? `<span class="fav ${fav?'on':''}" data-fav="${esc(key + '|' + o[0])}" title="Mark as a favourite">${fav ? '&#9829;' : '&#9825;'}</span>` : ''}
    </button>`;
  };
  const changed = key=>{
    if(!q.v1 || !L.v1Snap || !L.answers[key] || snap[key] == null || snap[key] === L.answers[key].label) return '';
    const was = q.o.find(o=>o[0] === snap[key]), diff = L.answers[key].price - (was ? was[1] : 0);
    return `<div class="changed">Changed since pricing: was <strong>${esc(snap[key])}</strong> · ${diff === 0 ? 'no change in price' : (diff > 0 ? '+ ' : '− ') + money(Math.abs(diff))}</div>`;
  };
  const miss = missing(q, L);
  let inner;
  if(q.type === 'qty'){
    const a = L.answers[q.id] || { qty:0, price:q.price, cost:q.cost };
    inner = `<div class="qty"><div class="stepper"><button type="button" data-qty="${q.id}" data-d="-1" ${lock || !a.qty ? 'disabled' : ''}>&minus;</button><span>${a.qty}</span><button type="button" data-qty="${q.id}" data-d="1" ${lock || a.qty >= q.max ? 'disabled' : ''}>+</button></div>
      <div><strong>${money(a.price)}</strong> per ${esc(q.unit)}${a.qty ? ` · <span class="mono" style="font-weight:700;color:var(--navy)">+ ${money(a.price * a.qty)}</span>` : ''}
        ${staff ? `<div class="staffline">our cost ${money(a.cost)} each · margin ${money(a.price - a.cost)} each</div>` : ''}</div></div>`;
  } else if(q.each){
    inner = q.each.map(r=>{ const key = q.id + '@' + r; return `<div class="eachrow"><div class="rm">${esc(r)}${!L.answers[key] ? ' <span class="chip red" style="margin-left:6px">to choose</span>' : ''}</div><div class="opts">${q.o.map((o,i)=>optCard(key, o, i)).join('')}</div></div>`; }).join('');
  } else {
    inner = `<div class="opts">${q.o.map((o,i)=>optCard(q.id, o, i)).join('')}</div>${changed(q.id)}`;
  }
  return `<div class="q ${miss.length && !lock ? 'todo' : ''}" id="q-${q.id}">
    <div class="q-head"><h3>${esc(q.t)}</h3>
      ${q.v1 && opts.fullSheet ? '<span class="chip v1">priced at the first meeting</span>' : ''}
      ${q.type === 'color' ? '<span class="chip plain">colour · no cost</span>' : ''}
      ${q.each ? '<span class="chip plain">pick for each room</span>' : ''}
      ${staff ? `<span class="chip" style="background:var(--staff-soft);color:var(--staff)">code ${q.cc} · ${esc(q.vendor || 'Alden')}</span>` : ''}</div>
    ${q.note ? `<div class="q-sub">${esc(q.note)}</div>` : ''}
    ${inner}</div>`;
}

// One meeting's worth of sections, one at a time, with the list down the side. kind 'v1' = Pricing (the lines on the paper

      <div class="noprint" style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        ${i > 0 ? `<button type="button" class="btn" data-room="${list[i-1].id}">&larr; ${esc(list[i-1].name)}</button>` : ''}
        <div class="grow"></div>

      <div class="q-head"><h3 style="font-size:16px;color:var(--navy)">${esc(c.desc)}</h3><span class="chip plain">custom item</span>${c.pending ? `<span class="chip soon">price to come${c.ask ? ' · asked ' + esc(c.ask) : ''}</span>` : ''}</div>
      ${c.pending ? (PRESENT ? '<div class="q-sub">We\'re getting a price on this for you.</div>'
          : `<div class="row2 noprint"><span class="muted">$</span><input type="number" min="0" step="1" placeholder="Price" data-cuprice="${ci}">${staff ? `<input type="number" min="0" step="1" placeholder="Our cost" data-cucost="${ci}">` : ''}<button type="button" class="btn sm primary" data-cuset="${ci}">Set price</button>${lock ? '' : `<button type="button" class="btn sm" data-delcustom="${ci}">Remove</button>`}</div>`)
        : `<div class="row2"><span class="mono" style="font-weight:700;color:var(--navy)">${plus(c.price)}</span>${staff ? `<span class="staffline">our cost ${money(c.cost)} · margin ${money(c.price - c.cost)} · code ${c.cc}</span>` : ''}${!lock && !PRESENT ? `<button type="button" class="btn sm noprint" data-delcustom="${ci}">Remove</button>` : ''}</div>`}
    </div>`).join('');
  if(lock || PRESENT) return items;
  const form = cuOpen ? `<div class="custom" style="border-left-color:var(--navy)"><div class="q-head"><h3 style="font-size:16px;color:var(--navy)">Add a custom item to ${esc(r.name)}</h3></div>
      <div style="margin-top:10px"><label class="f">What is it</label><input type="text" id="cuDesc" maxlength="200" placeholder="e.g. Built-in bench with cubbies"></div>
      <div class="radio2"><label><input type="radio" name="cuMode" value="now" ${cuMode === 'now' ? 'checked' : ''}> I have a price</label><label><input type="radio" name="cuMode" value="ask" ${cuMode === 'ask' ? 'checked' : ''}> It needs a price</label></div>
      ${cuMode === 'now' ? `<div class="grid" style="margin-top:10px">
          <div><label class="f">Customer price ($)</label><input type="number" id="cuPrice" min="0" step="1"></div>
          ${staff ? `<div><label class="f">Our cost ($)</label><input type="number" id="cuCost" min="0" step="1"></div>
          <div><label class="f">Cost code</label><select id="cuCode">${Object.entries(CODE_NAMES).map(([c,n])=>`<option value="${c}">${c} — ${n}</option>`).join('')}</select></div>` : ''}</div>`
        : `<div style="margin-top:10px;max-width:320px"><label class="f">Who should price it</label><select id="cuAsk">${TEAM.map(p=>`<option>${p}</option>`).join('')}</select>
           <div class="q-sub">They'd get a notice in the hub that this item needs a price. The sheet can't be confirmed until it has one.</div></div>`}
      <div style="margin-top:12px;display:flex;gap:8px"><button type="button" class="btn primary" id="cuAdd">Add it</button><button type="button" class="btn" id="cuCancel">Cancel</button></div></div>`
    : `<button type="button" class="addbtn noprint" id="cuOpenBtn"><b>+</b> Add a custom item</button>`;
  return items + form;
}

/* ---------- the pricing sheet as a document ----------
   Everything that was chosen, section by section, with prices: something to review, print across the table, or send.
   Office view prints an office copy (BT numbers, cost, margin); Customer view prints the customer's copy.
   The office CONFIRMS it before it goes out; any change afterwards un-confirms it. The customer's link is …?quote=LEAD. */
const QUOTE = new URLSearchParams(location.search).get('quote');
let docAll = false;                                   // also list the lines left at standard
const quoteUrl = L=>location.href.split('?')[0].split('#')[0] + '?quote=' + encodeURIComponent(L.id);
function quoteDoc(L, forCustomer){
  const office = !forCustomer && view === 'staff', staff = false;
  const ls = lines(L);
  const dname = (DEVS.find(d=>d.code === L.dev) || {}).name || '';
  const phase = (L.answers.phase || {}).label || '';
  const stdRow = q=>{                                 // a line nobody touched, for the "every line" version
    const what = 'Standard';
    return `<tr class="dstd"><td>${office && q.bt ? `<span class="mono" style="font-size:12px">${esc(q.bt)}</span> ` : ''}${esc(q.t)}</td><td>${esc(what)}</td><td class="num"></td></tr>`;
  };
  const secs = SECTIONS.map(r=>{
    const mine = ls.filter(l=>l.q.room.id === r.id), cu = L.custom.filter(c=>c.room === r.id);
    const rows = [];
    r.qs.forEach(q=>{ if(!asked(q, L)) return; const got = mine.filter(l=>l.q.id === q.id);
      if(got.length) got.forEach(l=>rows.push(l.typed
        ? `<tr><td colspan="${staff ? 5 : 3}" class="dn">${/_n$/.test(l.q.id) || l.q.id === 'misc' ? 'Note: ' : esc(l.q.t) + ': '}${esc(l.label)}</td></tr>`
        : `<tr><td>${office && l.q.bt ? `<span class="mono" style="font-size:12px">${esc(l.q.bt)}</span> ` : ''}${esc(l.q.t)}${l.where ? ' · ' + esc(l.where) : ''}</td><td>${esc(l.label)}</td><td class="num">${l.tbd ? '<em>price to come</em>' : l.price ? plus(l.price) : 'no charge'}</td>${staff ? `<td class="num st">${l.cost ? money(l.cost) : ''}</td><td class="num st">${l.price ? money(l.price - l.cost) : ''}</td>` : ''}</tr>`));
      else if(docAll && q.v1) rows.push(stdRow(q));
    });
    mine.filter(l=>l.typed).forEach(l=>rows.push(`<tr><td colspan="3" class="dn">Note: ${esc(l.label)}</td></tr>`));
    cu.forEach(c=>rows.push(`<tr><td>Custom item</td><td>${esc(c.desc)}</td><td class="num">${c.pending ? '<em>price to come</em>' : plus(c.price)}</td>${staff ? `<td class="num st">${c.pending ? '' : money(c.cost)}</td><td class="num st">${c.pending ? '' : money(c.price - c.cost)}</td>` : ''}</tr>`));
    if(!rows.join('')) return '';
    const sub = mine.reduce((s,l)=>s+l.price,0) + cu.reduce((s,c)=>s+c.price,0);
    return `<h3>${esc(r.name)}<span>${sub ? plus(sub) : ''}</span></h3><table><tbody>${rows.join('')}</tbody></table>`;
  }).join('');
  const up = upgrades(L), co = coTotal(L), wait = waiting(L).length;
  return `<div class="doc" id="quoteDoc">
    ${office ? '<div class="officecopy">OFFICE COPY — shows the BuilderTrend line numbers. Switch to Customer view for the copy that goes to the buyer.</div>' : ''}
    <div class="doc-head"><img src="../icons/logo.png" alt="Alden Homes">
      <div><h1>Pricing Sheet</h1><div class="sub">${L.quoteOk ? 'Confirmed ' + esc(nice(L.quoteOk)) : 'Draft · not yet confirmed'} · prices as of ${esc(nice(L.pricedOn))}</div></div></div>
    <div class="doc-facts">
      <div><span>Prepared for</span><b>${esc([L.name, L.name2].filter(Boolean).join(' & '))}</b></div>
      <div><span>Community</span><b>${esc(dname || 'To be decided')}</b></div>
      <div><span>Lot</span><b>${esc(L.lot ? '#' + L.lot : 'To be decided')}${phase ? ' · Phase ' + esc(phase) : ''}</b></div>
      <div><span>Home style</span><b>${esc(L.model || '')}</b></div>
      <div><span>Base price</span><b>${money(base(L))}</b></div>
    </div>
    ${secs || '<p class="muted" style="margin-top:20px">Nothing has been added to the base home yet.</p>'}
    ${L.cos.length ? `<h3>Change orders<span>${plus(co)}</span></h3><table><tbody>${L.cos.map(c=>`<tr><td>${esc(nice(c.date))}</td><td>${esc(c.desc)}</td><td class="num">${plus(c.price)}</td>${staff ? `<td class="num st">${money(c.cost)}</td><td class="num st">${money(c.price - c.cost)}</td>` : ''}</tr>`).join('')}<tr><td colspan="2">Change order fees</td><td class="num">${plus(L.cos.length * CO_FEE)}</td>${staff ? '<td></td><td></td>' : ''}</tr></tbody></table>` : ''}
    <div class="doc-total">
      <div><span>Base price · ${esc(L.model || '')}</span><span class="mono">${money(base(L))}</span></div>
      <div><span>Options, upgrades &amp; lot premium</span><span class="mono">${plus(up)}</span></div>
      ${co ? `<div><span>Change orders</span><span class="mono">${plus(co)}</span></div>` : ''}
      ${staff ? `<div style="color:var(--staff)"><span>Our cost of the options · margin on them</span><span class="mono">${money(upgradeCost(L))} · ${money(up - upgradeCost(L))}</span></div>` : ''}
      <div class="grand"><span>Total</span><span>${money(total(L))}</span></div>
      ${wait ? `<div style="color:#8a5d14"><span>${wait} custom item${wait === 1 ? ' is' : 's are'} still being priced and ${wait === 1 ? 'is' : 'are'} not in this total.</span><span></span></div>` : ''}
    </div>
    <div class="doc-fine">This is a pricing summary for discussion, not a contract. Prices are as of ${esc(nice(L.pricedOn))} and can change until selections are signed. Anything not listed here is built to the standard for this home style.<br>Alden Homes · Handcrafted Homes &amp; Communities</div>
  </div>`;
}

async function docPdf(btn, name){
  btn.disabled = true; const was = btn.textContent; btn.textContent = 'Making the PDF…';
  try{
    if(typeof html2pdf === 'undefined') await new Promise((res, rej)=>{ const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
    const el = document.getElementById('quoteDoc'), keep = el.style.cssText;
    el.style.boxShadow = 'none'; el.style.maxWidth = 'none'; el.style.margin = '0';
    await html2pdf().set({ margin:[0.35, 0.1, 0.45, 0.1], filename:name, image:{ type:'jpeg', quality:.95 }, html2canvas:{ scale:2, useCORS:true, backgroundColor:'#ffffff' },
      jsPDF:{ unit:'in', format:'letter', orientation:'portrait' }, pagebreak:{ mode:['css','legacy'], avoid:['tr','h3','.doc-total'] } }).from(el).save();
    el.style.cssText = keep;
  } catch(err){ console.error(err); window.print(); }
  btn.disabled = false; btn.textContent = was;
}

}
async function loadShared(id, done){
  cur = id; render();
  try{
    const res = await fetch(SYNC_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ action:'get', id, since:0 }) });
    const data = await res.json();
    if(data.sheet){
      ['custom','cos'].forEach(f=>{ if(!Array.isArray(data.sheet[f])) data.sheet[f] = []; });
      ['answers','favs'].forEach(f=>{ if(!data.sheet[f] || typeof data.sheet[f] !== 'object') data.sheet[f] = {}; });
      const i = leads.findIndex(l=>l.id === id); if(i >= 0) leads[i] = data.sheet; else leads.push(data.sheet);
      done('ready');
    } else if(!lead()) done('missing');
  } catch(err){ console.warn(err); if(!lead()) done('missing'); }
  render();
}

        <tbody>
          <tr><td><strong>${esc(L.model)}</strong> — base price</td><td class="muted">everything marked Standard</td><td class="num"><strong>${money(base(L))}</strong></td>${staff ? '<td class="st"></td><td class="st"></td>' : ''}</tr>
          ${rows}
          <tr class="tot"><td colspan="2">Upgrades &amp; lot premium</td><td class="num">${plus(up)}</td>${staff ? `<td class="num st">${money(upCost)}</td><td class="num st">${money(up - upCost)} (${up ? Math.round((up - upCost) / up * 100) : 0}%)</td>` : ''}</tr>
          ${L.cos.map(c=>`<tr><td>Change order · ${esc(nice(c.date))}</td><td>${esc(c.desc)}</td><td class="num">+ ${money(c.price)}</td>${staff ? `<td class="num st">${money(c.cost)}</td><td class="num st">${money(c.price - c.cost)}</td>` : ''}</tr>`).join('')}
          ${L.cos.length ? `<tr><td colspan="2">Change order fees (${L.cos.length} × ${money(CO_FEE)})</td><td class="num">+ ${money(L.cos.length * CO_FEE)}</td>${staff ? '<td class="st"></td><td class="st"></td>' : ''}</tr>` : ''}
          <tr class="tot"><td colspan="2">Total</td><td class="num">${money(total(L))}</td>${staff ? '<td class="st"></td><td class="st"></td>' : ''}</tr>

function vendors(L){

function codes(L){
  const by = {};
  const put = (cc, price, cost)=>{ by[cc] = by[cc] || { price:0, cost:0 }; by[cc].price += price; by[cc].cost += cost; };
  lines(L).forEach(l=>put(l.q.cc, l.price, l.cost));
  L.custom.forEach(c=>put(c.cc, c.price, c.cost));
  L.cos.forEach(c=>put(c.cc, c.price, c.cost));
  if(L.cos.length) put(90, L.cos.length * CO_FEE, 0);
  const rows = Object.entries(by).filter(([,v])=>v.price || v.cost).sort((a,b)=>a[0]-b[0]);
  const tp = rows.reduce((s,[,v])=>s+v.price,0), tc = rows.reduce((s,[,v])=>s+v.cost,0);
  return `<div class="banner staff"><p><strong>Upgrades by cost code.</strong> The "our cost" column is what this sheet adds to the home's budget, on top of the base budget for the model. The price column is what it adds to the settlement.</p></div>

      ${rows.map(([cc,v])=>`<tr><td class="mono">${cc}</td><td>${esc(CODE_NAMES[cc] || '')}</td><td class="num">${money(v.price)}</td><td class="num">${money(v.cost)}</td><td class="num">${money(v.price - v.cost)}</td></tr>`).join('')}
      <tr class="tot"><td colspan="2">Total</td><td class="num">${money(tp)}</td><td class="num">${money(tc)}</td><td class="num">${money(tp - tc)}</td></tr>
    </tbody></table></div>`;
}

function totalBar(L){
  const up = upgrades(L), co = coTotal(L);
  return `<div><div class="sub">${locked(L) ? 'Contract total' : L.stage === 'v1' ? 'Ballpark so far' : 'Total so far'}</div><div class="big">${money(total(L))}</div></div>
    <div class="sub">Base ${money(base(L))}<br>Upgrades + ${money(up)}${co ? ' · change orders + ' + money(co) : ''}</div>
    <div class="grow"></div>
    ${locked(L) ? '' : '<span class="sub">Saved automatically</span>'}
    ${PRESENT ? '' : `<button type="button" class="btn" id="saveClose2">${locked(L) ? 'Close' : 'Save &amp; close'}</button>`}`;
}

/* ---------- doing things ---------- */
function touch(L){ L.updated = iso(new Date()); if(L.quoteOk && !locked(L)) L.quoteOk = null; }
document.addEventListener('click', e=>{
  const t = e.target, L = lead();
  const sw = t.closest('#viewSw button'); if(sw){ view = sw.dataset.view; if(view !== 'staff' && ['vendors','codes'].includes(tab)) tab = 'summary'; render(); return; }
  if(QUOTE){ if(t.closest('#docPrint')) window.print(); else if(t.closest('#docPdf') && L) docPdf(t.closest('#docPdf'), 'Alden Homes pricing sheet - ' + L.name + '.pdf'); return; }
  if(t.closest('#shPdf')){ showPdf(t.closest('#shPdf')); return; }
  if(t.closest('#shShare')){
    const url = location.href, title = document.title;
    if(navigator.share) navigator.share({ title, text:'Take a look at what we chose for our Alden home.', url }).catch(()=>{});
    else navigator.clipboard.writeText(url).then(()=>toast('Link copied — paste it anywhere'), ()=>toast('Copy the address from the bar above'));
    return;
  }
  if(t.closest('#joinBtn')){
    const code = ($('joinCode').value || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    if(code.length < 4){ toast('Type the code from the rep\'s screen'); return; }
    location.href = location.href.split('?')[0].split('#')[0] + '?present=L' + encodeURIComponent(code); return;
  }
  if(t.closest('#lockDemo')){ e.preventDefault(); try{ localStorage.removeItem(CODE_KEY); } catch(err){} location.reload(); return; }
  if(t.closest('#resetDemo')){ e.preventDefault(); leads = seedLeads(); render(); toast('Sample leads put back'); return; }
  if(t.closest('#newLeadBtn')){ newOpen = !newOpen; render(); if(newOpen) $('nName').focus(); return; }
  if(t.closest('#nStart')){
    const name = $('nName').value.trim(); if(!name){ toast('Add the buyer\'s name first'); return; }
    const n = { id:'L'+Math.random().toString(36).slice(2,8), name, name2:$('nName2').value.trim(), phone:$('nPhone').value.trim(), email:$('nEmail').value.trim(), dev:$('nDev').value, lot:$('nLot').value, model:$('nModel').value, line:$('nLine').value, basePrice:Number($('nBase').value) || 0,
      stage:'v1', created:iso(new Date()), v1Date:iso(new Date()), updated:iso(new Date()), pricedOn:iso(new Date()), answers:{}, v1Snap:null, custom:[], favs:{}, cos:[], signedOn:'', notes:[], follow:null };
    leads.push(n); cur = n.id; tab = 'v1'; roomId = 'lot'; newOpen = false; render(); window.scrollTo(0, 0); toast('Lead saved'); return;
  }
  const open = t.closest('[data-open]'); if(open){ cur = open.dataset.open; const o = lead(); tab = o.stage === 'v1' ? 'v1' : o.stage === 'signed' ? 'sign' : 'full'; roomId = tab === 'full' ? ROOMS[0].id : 'lot'; render(); window.scrollTo(0, 0); return; }
  if(!L) return;
  if(!PRESENT){
    const setFollow = date=>{ L.follow = { date, what: ($('followWhat').value || '').trim() || (L.follow && L.follow.what) || '' }; render(); toast('Follow-up set for ' + nice(date)); };
    const fin = t.closest('[data-follow-in]'); if(fin){ setFollow(daysAhead(Number(fin.dataset.followIn))); return; }
    if(t.closest('#followDone')){ L.notes = noteList(L); L.notes.push({ text:'Followed up' + (L.follow.what ? ': ' + L.follow.what : '.'), at:iso(new Date()) }); L.follow = null; render(); toast('Marked done and noted'); return; }
    if(t.closest('#followClear')){ L.follow = null; render(); return; }
    if(t.closest('#noteAdd')){
      const text = ($('noteText').value || '').trim(); if(!text){ toast('Type the note first'); return; }
      L.notes = noteList(L); L.notes.push({ text, at:iso(new Date()) }); render(); toast('Note saved'); return;
    }
    const dn = t.closest('[data-delnote]'); if(dn){ L.notes = noteList(L).filter(nt=>(nt.at + '|' + nt.text.slice(0, 20)) !== dn.dataset.delnote); render(); return; }
  }
  if(t.closest('#shareBtn')){
    shareOpen = !shareOpen;
    if(shareOpen && !shared[L.id]){ shared[L.id] = true; try{ localStorage.setItem(SHARED, JSON.stringify(shared)); } catch(err){} syncTick(); }
    render(); return;
  }
  if(t.closest('#shareCopy')){ navigator.clipboard.writeText(presentUrl(L)).then(()=>toast('Link copied'), ()=>toast('Select the link and copy it')); return; }
  if(t.closest('#shareOpenBtn')){ window.open(presentUrl(L), 'aldenCustomerScreen', 'width=1000,height=800'); return; }
  if(t.closest('#backLeads') || t.closest('#saveClose') || t.closest('#saveClose2')){ e.preventDefault(); cur = null; render(); window.scrollTo(0, 0); if(!locked(L)) toast('Saved. It\'s on file whenever they come back.'); return; }
  const tb = t.closest('[data-tab]'); if(tb){ tab = tb.dataset.tab; if(tab === 'v1' && !PRICING.some(x=>x.id === roomId)) roomId = PRICING[0].id; if(tab === 'full' && !ROOMS.some(x=>x.id === roomId)) roomId = ROOMS[0].id; render(); window.scrollTo(0, 0); return; }
  const rm = t.closest('[data-room]'); if(rm){ roomId = rm.dataset.room; if(tab !== 'v1' && tab !== 'full') tab = 'full'; render(); window.scrollTo(0, 0); return; }
  const jump = t.closest('[data-jump]'); if(jump){ e.preventDefault(); roomId = jump.dataset.jump; tab = 'full'; render(); window.scrollTo(0, 0); return; }
  if(t.closest('#printBtn')){ window.print(); return; }
  if(t.closest('#docPrint')){ window.print(); return; }
  if(t.closest('#docPdf')){ docPdf(t.closest('#docPdf'), 'Alden Homes pricing sheet - ' + L.name + '.pdf'); return; }
  if(t.closest('#quoteConfirm')){
    // confirming also puts the sheet on the hub's server, so the customer's link works
    L.quoteOk = iso(new Date()); shared[L.id] = true; try{ localStorage.setItem(SHARED, JSON.stringify(shared)); } catch(err){}
    syncTick(); render(); toast('Pricing confirmed. It can go to the customer now.'); return;
  }
  if(t.closest('#quoteUndo')){ L.quoteOk = null; render(); return; }
  if(t.closest('#quoteCopy')){ navigator.clipboard.writeText(quoteUrl(L)).then(()=>toast('Link copied'), ()=>toast('Select the link and copy it')); return; }
  if(t.closest('#quoteOpen')){ window.open(quoteUrl(L), '_blank'); return; }
  if(t.closest('#showMake')){
    // the sheet has to be on the hub's server for the link to work on someone else's phone
    shared[L.id] = true; try{ localStorage.setItem(SHARED, JSON.stringify(shared)); } catch(err){}
    syncTick(); render(); toast('Share link ready'); return;
  }
  if(t.closest('#showCopy')){ navigator.clipboard.writeText(showUrl(L)).then(()=>toast('Link copied'), ()=>toast('Select the link and copy it')); return; }
  if(t.closest('#showOpen')){ window.open(showUrl(L), '_blank'); return; }
  if(t.closest('#repriceBtn')){
    drift(L).forEach(x=>{ x.a.price = x.t.price; x.a.cost = x.t.cost; });
    L.pricedOn = iso(new Date()); touch(L); render(); toast('Updated to today\'s prices'); return;
  }
  if(locked(L)){
    if(t.closest('#coAdd')){
      const desc = $('coDesc').value.trim(), price = Number($('coPrice').value);
      if(!desc || !(price >= 0) || $('coPrice').value === ''){ toast('Say what\'s changing and the price'); return; }
      L.cos.push({ desc, price, cost:Number($('coCost').value) || 0, cc:Number($('coCode').value), date:iso(new Date()) }); touch(L); render(); toast('Change order sent to the buyer to sign');
    }
    return;
  }
  const tg = t.closest('[data-bt-tog]'), stp = t.closest('[data-bt-step]');
  if(tg || stp){
    const k = tg ? tg.dataset.btTog : stp.dataset.btStep, q = qOfKey(k), c = q && q.c[Number(k.split('#')[1])];
    if(!c) return;
    const a = L.answers[k] || { qty:0, price:c.p || 0 };     // the price is fixed the moment it's first picked
    a.qty = tg ? (a.qty ? 0 : 1) : Math.max(0, Math.min(99, a.qty + Number(stp.dataset.d)));
    if(a.qty) L.answers[k] = a; else delete L.answers[k];
    touch(L); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  const fav = t.closest('[data-fav]'); if(fav){ e.stopPropagation(); L.favs[fav.dataset.fav] = !L.favs[fav.dataset.fav]; if(!L.favs[fav.dataset.fav]) delete L.favs[fav.dataset.fav]; render(); return; }
  const pick = t.closest('[data-pick]');
  if(pick){
    const key = pick.dataset.pick, q = qById(key.split('@')[0]), o = q.o.find(x=>x[0] === pick.dataset.opt);
    L.answers[key] = { label:o[0], price:o[1], cost:o[2] };
    // an answer can make another question irrelevant (no fireplace -> no mantel); drop those answers
    ALL_QS.forEach(x=>{ if(!asked(x, L)) keysOf(x).forEach(k=>{ delete L.answers[k]; }); });
    touch(L); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  const qb = t.closest('[data-qty]');
  if(qb){
    const q = qById(qb.dataset.qty), a = L.answers[q.id] || { qty:0, price:q.price, cost:q.cost };
    a.qty = Math.max(0, Math.min(q.max, a.qty + Number(qb.dataset.d))); L.answers[q.id] = a;
    touch(L); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if(t.closest('#toFull')){
    // the first time they move on, remember what was priced, so later changes can be shown
    if(!L.v1Snap) L.v1Snap = snapAll(L);
    L.stage = 'v2'; tab = 'full'; roomId = ROOMS[0].id; touch(L); render(); window.scrollTo(0, 0); return;
  }
  if(t.closest('#cuOpenBtn')){ cuOpen = true; cuMode = 'now'; render(); const d = $('cuDesc'); if(d) d.focus(); return; }
  if(t.closest('#cuCancel')){ cuOpen = false; render(); return; }
  if(t.closest('#cuAdd')){
    const desc = $('cuDesc').value.trim();
    if(!desc){ toast('Say what the item is'); return; }
    if(cuMode === 'ask'){
      const who = $('cuAsk').value;
      L.custom.push({ desc, price:0, cost:0, cc:90, room:roomId, pending:true, ask:who, at:iso(new Date()) });
      cuOpen = false; touch(L); render(); toast(who + ' would be notified that this needs a price'); return;
    }
    const price = Number($('cuPrice').value);
    if($('cuPrice').value === '' || !(price >= 0)){ toast('Type the price, or choose "It needs a price"'); return; }
    const costEl = $('cuCost'), codeEl = $('cuCode');
    L.custom.push({ desc, price, cost: costEl && costEl.value !== '' ? Number(costEl.value) || 0 : Math.round(price * 0.72), cc: codeEl ? Number(codeEl.value) : 90, room:roomId });
    cuOpen = false; touch(L); render(); toast('Added to the sheet'); return;
  }
  const cs = t.closest('[data-cuset]');
  if(cs){
    const i = Number(cs.dataset.cuset), c = L.custom[i], pe = document.querySelector('[data-cuprice="' + i + '"]'), ce = document.querySelector('[data-cucost="' + i + '"]');
    const price = Number(pe.value);
    if(!c || pe.value === '' || !(price >= 0)){ toast('Type the price first'); return; }
    c.price = price; c.cost = ce && ce.value !== '' ? Number(ce.value) || 0 : Math.round(price * 0.72); delete c.pending;
    touch(L); render(); toast('Price set'); return;
  }
  const dc = t.closest('[data-delcustom]'); if(dc){ L.custom.splice(Number(dc.dataset.delcustom), 1); touch(L); render(); return; }
  if(t.closest('#signBtn')){
    if(!$('sg1').value.trim()){ toast('Add the buyer\'s name'); return; }
    if(!$('sgAgree').checked){ toast('Tick the box to approve first'); return; }
    L.name = $('sg1').value.trim(); L.name2 = $('sg2').value.trim();
    L.stage = 'signed'; L.signedOn = iso(new Date()); L.pricedOn = L.signedOn; touch(L); tab = 'sign'; render(); window.scrollTo(0, 0); toast('Signed and locked');
  }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Enter' && e.target.id === 'joinCode') $('joinBtn').click(); });
document.addEventListener('change', e=>{
  if(e.target.id === 'nLine'){ $('nModel').innerHTML = (STYLES[e.target.value] || []).map(m=>`<option>${m}</option>`).join(''); return; }
  if(e.target.dataset && (e.target.dataset.btNum || e.target.dataset.note)){
    const L1 = lead(); if(!L1 || locked(L1)) return;
    if(e.target.dataset.note){ const v = e.target.value.trim(); if(v) L1.answers[e.target.dataset.note] = { label:v, qty:0, price:0 }; else delete L1.answers[e.target.dataset.note]; }
    else { const k = e.target.dataset.btNum, q = qOfKey(k), c = q && q.c[Number(k.split('#')[1])]; if(!c) return;
      const v = Math.max(0, Math.min(99999, Math.round(Number(e.target.value) || 0)));
      if(!v) delete L1.answers[k]; else { const a = L1.answers[k] || { price:c.p || 0 }; a.qty = v; L1.answers[k] = a; } }
    touch(L1); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if(e.target.name === 'cuMode'){ const keep = ($('cuDesc') || {}).value || ''; cuMode = e.target.value; render(); if($('cuDesc')) $('cuDesc').value = keep; return; }
  if(e.target.id === 'docAll'){ docAll = e.target.checked; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const el = e.target, L0 = lead();
  if(L0 && !locked(L0) && el.dataset && (el.dataset.num || el.dataset.money || el.dataset.text)){
    const id = el.dataset.num || el.dataset.money || el.dataset.text, q = qById(id);
    if(!q) return;
    if(el.dataset.num){ const v = Math.max(0, Math.min(q.max, Math.round(Number(el.value) || 0))); if(!v) delete L0.answers[id]; else { const a = L0.answers[id] || { price:q.price, cost:q.cost }; a.qty = v; L0.answers[id] = a; } }
    else if(el.dataset.money){ const v = Math.max(0, Math.round(Number(el.value) || 0)); if(!v) delete L0.answers[id]; else L0.answers[id] = moneyAns(q, v); }
    else { const v = el.value.trim(); if(!v) delete L0.answers[id]; else L0.answers[id] = { label:v, price:0, cost:0 }; }
    ALL_QS.forEach(x=>{ if(!asked(x, L0)) keysOf(x).forEach(k=>{ delete L0.answers[k]; }); });
    touch(L0); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if(e.target.id === 'followDate' && e.target.value && lead()){ const L = lead(); L.follow = { date:e.target.value, what: ($('followWhat').value || '').trim() || (L.follow && L.follow.what) || '' }; render(); toast('Follow-up set for ' + nice(L.follow.date)); return; }
  if(e.target.id === 'nDev'){ const d = e.target.value; $('nLot').innerHTML = '<option value="">Not chosen yet</option>' + LOTS.filter(l=>l.dev === d).map(l=>`<option value="${l.lot}">Lot ${l.lot} — ${esc(l.addr)}</option>`).join(''); }
});

/* ---------- the way in ----------
   The demo carries real prices, so it opens with a passcode. The code is checked by the hub's server, which hands back the
   price list; nothing sensitive is in this file. A customer screen or a shared link gets the list by its sheet's own link. */
const CODE_KEY = 'aldenDemoCode';
let gateMsg = '';
async function fetchCatalog(body){
  const res = await fetch(SYNC_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ action:'catalog', ...body }) });
  if(res.status === 403) return 'wrong';
  if(res.status === 429) return 'locked';
  if(!res.ok) return 'down';
  const data = await res.json();
  buildCatalog(data.catalog || []);
  return 'ok';
}
function gateScreen(){
  document.body.classList.add('show');
  $('totalbar').style.display = 'none';
  $('root').innerHTML = `<div class="wrap"><div class="card gate"><img src="../icons/logo.png" alt="Alden Homes" style="height:64px">
    <h2 style="margin-top:14px">Selections demo</h2><p class="lede" style="margin:6px auto 0">Enter the passcode to open it.</p>
    <input type="tel" inputmode="numeric" id="gateCode" maxlength="8" autocomplete="off" style="margin-top:16px" aria-label="Passcode">
    <div style="margin-top:12px"><button type="button" class="btn primary" id="gateGo" style="width:100%">Open</button></div>
    <p class="muted" id="gateMsg" style="font-size:13.5px;margin-top:10px;min-height:20px;color:var(--red)">${esc(gateMsg)}</p></div></div>`;
  const i = $('gateCode'); if(i) i.focus();
}
async function tryCode(code, quiet){
  if(!quiet){ const b = $('gateGo'); if(b){ b.disabled = true; b.textContent = 'Checking…'; } }
  let r = 'down';
  try{ r = await fetchCatalog({ code }); } catch(e){ r = 'down'; }
  if(r === 'ok'){ try{ localStorage.setItem(CODE_KEY, code); } catch(e){} document.body.classList.remove('show'); return true; }
  try{ localStorage.removeItem(CODE_KEY); } catch(e){}
  gateMsg = quiet ? '' : r === 'wrong' ? 'That passcode isn\'t right.' : r === 'locked' ? 'Too many wrong tries. Wait an hour and try again.' : 'Couldn\'t reach the server. Check the connection and try again.';
  gateScreen();
  return false;
}
async function boot(){
  const linkId = PRESENT || SHOW || QUOTE;
  if(linkId){
    // someone holding a sheet's link: the list comes with the link, no passcode
    $('root').innerHTML = '<div class="wrap"><div class="card" style="margin-top:60px;text-align:center"><h2>Opening…</h2></div></div>';
    let r = 'down'; try{ r = await fetchCatalog({ id:linkId }); } catch(e){}
    if(r !== 'ok'){ $('totalbar').style.display = 'none'; $('root').innerHTML = `<div class="wrap"><div class="card" style="margin-top:60px;text-align:center"><h2>This link isn't active.</h2><p class="lede" style="margin:8px auto 0">Ask your Alden Homes rep to share it again.</p></div></div>`; return; }
  } else {
    let saved = ''; try{ saved = localStorage.getItem(CODE_KEY) || ''; } catch(e){}
    if(!saved){ gateScreen(); return; }
    if(!(await tryCode(saved, true))) return;
  }
  start();
}
function start(){
  load();
  if(SHOW){ loadShow(); return; }
  if(QUOTE){ loadShared(QUOTE, st=>{ quoteState = st; }); return; }
  // the customer's screen opens on whatever the office is looking at
  if(PRESENT){ try{ const nv = JSON.parse(localStorage.getItem(NAV) || 'null'); if(nv && nv.id === PRESENT){ tab = nv.tab; roomId = nv.roomId; } } catch(e){} }
  render();
}
document.addEventListener('click', async e=>{ if(e.target.closest('#gateGo')){ const code = ($('gateCode').value || '').trim(); if(!code) return; if(await tryCode(code)) start(); } });
document.addEventListener('keydown', e=>{ if(e.key === 'Enter' && e.target.id === 'gateCode') $('gateGo').click(); });
boot();

</script>
