<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alden Homes | Selections (demo)</title>
<style>
  :root{
    --navy:#4B4F54; --navy-2:#33363a; --line:#d4d2c8; --line-soft:#ece8dd; --paper:#f5f4ef; --paper-2:#ffffff;
    --ink:#33363a; --ink-soft:#6b6f72; --sage:#A3AA83; --sage-2:#6B7355; --sage-soft:#eef0e8; --amber:#c98a2b; --amber-soft:#fdf3e2;
    --red:#a94438; --red-soft:#fbeae4; --good:#3f7a4e; --good-soft:#eaf1ec; --staff:#4a6b8a; --staff-soft:#e9eff5;
    --shadow:0 1px 2px rgba(30,32,34,.08),0 4px 14px rgba(30,32,34,.06); --radius:8px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;padding-bottom:96px}
  h1,h2,h3,p{margin:0}
  button,input,select,textarea{font-family:inherit;font-size:inherit}
  button{cursor:pointer}
  .mono{font-family:"Courier New",monospace}
  .muted{color:var(--ink-soft)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 clamp(12px,3vw,28px)}

  .top{background:var(--paper-2);border-bottom:4px solid var(--sage);position:sticky;top:0;z-index:50}
  .top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0}
  .logo{font-weight:800;letter-spacing:.5px;color:var(--navy)}
  .logo span{color:var(--sage-2)}
  .top a{color:var(--ink-soft);text-decoration:none;font-size:13px;font-weight:600}
  .grow{flex:1}
  .pill{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:var(--amber-soft);color:#8a5d14;border-radius:20px;padding:4px 10px}
  .viewsw{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
  .viewsw button{border:none;background:none;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink-soft)}
  .viewsw button.on{background:var(--navy);color:#fff}
  .viewsw button.on.staff{background:var(--staff)}

  .btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:var(--radius);padding:10px 16px;font-weight:700;font-size:14.5px}
  .btn:hover{border-color:var(--navy)}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .btn.good{background:var(--good);border-color:var(--good);color:#fff}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn:disabled{opacity:.45;cursor:default}
  .card{background:var(--paper-2);box-shadow:var(--shadow);border-radius:var(--radius);padding:18px 20px;margin-top:16px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--sage-2)}
  h1{font-size:26px;color:var(--navy);margin-top:4px}
  h2{font-size:18px;color:var(--navy)}
  .lede{color:var(--ink-soft);margin-top:6px;line-height:1.5;max-width:760px}
  label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
  input[type=text],input[type=tel],input[type=email],input[type=number],select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--ink)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
  .chip.v1{background:var(--amber-soft);color:#8a5d14}
  .chip.v2{background:var(--staff-soft);color:var(--staff)}
  .chip.signed{background:var(--good-soft);color:var(--good)}
  .chip.red{background:var(--red-soft);color:var(--red)}
  .chip.plain{background:var(--sage-soft);color:var(--sage-2)}

  /* leads list */
  .lead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line-soft)}
  .lead:first-child{border-top:none}
  .lead .who{flex:1 1 240px;min-width:0}
  .lead .who strong{font-size:16px;color:var(--navy)}
  .lead .amt{font-family:"Courier New",monospace;font-weight:700;color:var(--navy);min-width:110px;text-align:right}

  /* tabs */
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-top:16px;border-bottom:2px solid var(--line)}
  .tab{border:none;background:none;padding:10px 14px;font-weight:700;font-size:14.5px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab.on{color:var(--navy);border-bottom-color:var(--sage-2)}
  .tab.staff{color:var(--staff)}
  .tab.staff.on{border-bottom-color:var(--staff)}
  .tab .n{font-size:11px;background:var(--red-soft);color:var(--red);border-radius:10px;padding:1px 7px;margin-left:5px}

  /* rooms layout */
  .rooms{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;margin-top:16px;align-items:start}
  @media (max-width:820px){ .rooms{grid-template-columns:1fr} .roomnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:static!important} .roomnav button{flex:none;width:auto;min-width:150px;background:var(--paper-2);border-color:var(--line-soft)} }
  .roomnav{position:sticky;top:76px}
  .roomnav button{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:var(--radius);padding:9px 11px;margin-bottom:4px;color:var(--ink)}
  .roomnav button.on{background:var(--paper-2);border-color:var(--line);box-shadow:var(--shadow)}
  .roomnav .rn{font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
  .roomnav .rp{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .roomnav .done{color:var(--good)}
  .roomnav .bar{height:4px;background:var(--line-soft);border-radius:2px;margin-top:6px;overflow:hidden}
  .roomnav .bar span{display:block;height:100%;background:var(--sage-2)}
  .deadline{font-size:12.5px;background:var(--amber-soft);color:#8a5d14;border-radius:6px;padding:7px 10px;margin-top:10px;display:inline-block}

  /* questions */
  .q{background:var(--paper-2);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px 18px;margin-top:14px}
  .q.todo{border-left:4px solid var(--amber)}
  .q-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .q-head h3{font-size:16.5px;color:var(--navy)}
  .q-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  .opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:12px}
  .opt{position:relative;text-align:left;border:2px solid var(--line);background:#fff;border-radius:var(--radius);padding:0;overflow:hidden;color:var(--ink)}
  .opt:hover{border-color:var(--sage)}
  .opt.sel{border-color:var(--good);box-shadow:0 0 0 2px var(--good-soft)}
  .opt:disabled{cursor:default;opacity:.85}
  .opt .art{height:78px;background:#f7f6f1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .opt .art svg{width:100%;height:100%}
  .opt .txt{padding:9px 11px 10px}
  .opt .nm{font-weight:700;font-size:14px;line-height:1.3}
  .opt .pr{font-size:13px;margin-top:3px;font-family:"Courier New",monospace;font-weight:700;color:var(--navy)}
  .opt .pr.inc{color:var(--good);font-family:inherit}
  .opt .std{position:absolute;top:6px;left:6px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:rgba(255,255,255,.92);color:var(--good);border-radius:4px;padding:2px 6px}
  .opt .tick{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;font-size:13px;display:none;align-items:center;justify-content:center}
  .opt.sel .tick{display:flex}
  .opt .fav{position:absolute;bottom:6px;right:8px;font-size:17px;color:#c9c4b5;line-height:1}
  .opt .fav.on{color:var(--red)}
  .staffline{font-size:11.5px;color:var(--staff);background:var(--staff-soft);border-radius:4px;padding:3px 6px;margin-top:6px;line-height:1.4}
  .eachrow{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-soft)}
  .eachrow:first-of-type{border-top:none;padding-top:0}
  .eachrow .rm{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-soft)}
  .qty{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
  .stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
  .stepper button{border:none;background:#fff;width:44px;height:44px;font-size:22px;color:var(--navy)}
  .stepper button:disabled{opacity:.3}
  .stepper span{min-width:48px;text-align:center;font-weight:700;font-size:18px}
  .changed{font-size:12.5px;background:var(--amber-soft);color:#8a5d14;border-radius:6px;padding:6px 10px;margin-top:10px;display:inline-block}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);padding:8px 8px;border-bottom:2px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  .num{text-align:right;font-family:"Courier New",monospace;white-space:nowrap}
  tr.tot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
  tr.grp td{background:#faf8f2;font-weight:700;color:var(--navy);font-size:13px}
  td.st, th.st{color:var(--staff)}

  .banner{border-radius:var(--radius);padding:14px 16px;margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .banner.amber{background:var(--amber-soft);border:1px solid #ecd9b0;color:#6e4a10}
  .banner.good{background:var(--good-soft);border:1px solid #c5dccb;color:#27573a}
  .banner.staff{background:var(--staff-soft);border:1px solid #c9d8e6;color:#2c4a66}
  .banner p{flex:1 1 280px;line-height:1.45;font-size:14.5px}

  .totalbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper-2);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(30,32,34,.08);z-index:40}
  .totalbar .in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0}
  .totalbar .big{font-family:"Courier New",monospace;font-size:24px;font-weight:700;color:var(--navy)}
  .totalbar .sub{font-size:12.5px;color:var(--ink-soft)}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--navy-2);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
  .toast.show{opacity:1}
  /* the customer's own screen: bigger, nothing but their choices */
  body.present{font-size:18px}
  body.present .opts{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  body.present .opt .art{height:130px}
  body.present .opt .nm{font-size:17px}
  body.present .opt .pr{font-size:16px}
  body.present .q-head h3{font-size:21px}
  body.present .q{padding:20px 22px}
  body.present #viewSw, body.present .top a, body.present .pill{display:none}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--good)}
  .live i{width:9px;height:9px;border-radius:50%;background:var(--good);animation:livePulse 1.6s ease-in-out infinite}
  @keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(63,122,78,.5)}50%{box-shadow:0 0 0 7px rgba(63,122,78,0)}}
  .opt.flash{animation:optFlash 1.6s ease-out}
  @keyframes optFlash{0%{box-shadow:0 0 0 6px rgba(201,138,43,.75)}100%{box-shadow:0 0 0 2px var(--good-soft)}}
  .sharebox{background:var(--staff-soft);border:1px solid #c9d8e6;border-radius:var(--radius);padding:14px 16px;margin-top:14px;color:#2c4a66}
  .sharebox input{font-family:"Courier New",monospace;font-size:13px;margin-top:8px}
  /* the shareable selection sheet (?show=LEAD): no prices, made to be passed around */
  body.show{background:#fff;padding-bottom:0}
  body.show .top, body.show .totalbar{display:none!important}
  body.show #root{max-width:none;padding:0}
  .sh, .sh *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sh-hero{background:linear-gradient(155deg,#2b2e31 0%,#4B4F54 55%,#646b4e 100%);color:#fff;padding:40px 0 48px;text-align:center}
  .sh-logo{display:block;width:fit-content;margin:0 auto;background:#fff;border-radius:10px;padding:12px 22px}
  .sh-logo img{height:58px;display:block}
  .sh-kicker{letter-spacing:3.5px;text-transform:uppercase;font-size:12px;font-weight:700;color:#cfd3b8;margin-top:30px}
  .sh-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,7vw,62px);font-weight:700;line-height:1.05;margin-top:10px;color:#fff}
  .sh-sub{color:#e9ebdf;margin-top:14px;font-size:17px}
  .sh-stats{display:flex;justify-content:center;gap:clamp(22px,6vw,64px);flex-wrap:wrap;margin-top:32px}
  .sh-stat b{display:block;font-family:Georgia,serif;font-size:38px;line-height:1;color:#fff}
  .sh-stat span{display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#cfd3b8;margin-top:7px}
  .sh-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .sh-actions button{border:none;border-radius:24px;padding:12px 22px;font-weight:700;font-size:15px;background:#fff;color:var(--navy)}
  .sh-actions button.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6)}
  .sh-sec{padding:40px 0 4px}
  .sh-sec h2{font-family:Georgia,serif;font-size:29px;color:var(--navy);display:flex;align-items:center;gap:14px}
  .sh-sec h2:after{content:"";flex:1;height:2px;background:var(--sage)}
  .sh-lede{color:var(--ink-soft);margin-top:8px;font-size:16px;max-width:680px;line-height:1.5}
  .sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-top:20px}
  .sh-grid.big{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .sh-tile{position:relative;border:1px solid var(--line-soft);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow);break-inside:avoid;page-break-inside:avoid}
  .sh-tile .art{height:118px;background:#f7f6f1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sh-grid.big .sh-tile .art{height:170px}
  .sh-tile .art svg{width:100%;height:100%}
  .sh-tile .art .count{font-family:Georgia,serif;font-size:56px;font-weight:700;color:var(--sage-2)}
  .sh-tile .txt{padding:12px 14px 14px}
  .sh-tile .lab{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--sage-2)}
  .sh-tile .val{font-size:17px;font-weight:700;color:var(--navy);line-height:1.25;margin-top:3px}
  .sh-grid.big .sh-tile .val{font-family:Georgia,serif;font-size:22px}
  .sh-tile .up{position:absolute;top:10px;left:10px;background:var(--navy);color:#fff;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-radius:20px;padding:4px 10px}
  .sh-made{border-left:5px solid var(--sage);background:#faf8f2;border-radius:0 10px 10px 0;padding:16px 20px;margin-top:14px;font-family:Georgia,serif;font-size:20px;color:var(--navy);break-inside:avoid}
  .sh-cta{background:var(--sage-soft);border-top:4px solid var(--sage);margin-top:48px;padding:44px 0 50px;text-align:center}
  .sh-cta h2{font-family:Georgia,serif;font-size:clamp(26px,4.5vw,36px);color:var(--navy)}
  .sh-cta p{color:var(--ink-soft);margin-top:10px;font-size:17px}
  .sh-cta .who{margin-top:20px;font-weight:700;color:var(--navy);font-size:18px}
  .sh-foot{text-align:center;color:var(--ink-soft);font-size:12px;padding:16px 0 26px}
  .sharelink{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .sharelink input{flex:1 1 280px;font-family:"Courier New",monospace;font-size:13px}
  body.pdfing .noprint{display:none!important}
  @page{margin:0}
  @media print{ .top,.tabs,.totalbar,.noprint{display:none!important} body{background:#fff;padding:0} .card{box-shadow:none;border:1px solid #ccc} }
</style>
</head>
<body>

<div class="top"><div class="wrap top-in">
  <div class="logo">ALDEN<span>·</span>HUB</div>
  <a href="index.html">Demo home</a>
  <span class="pill">Selections demo · made-up data</span>
  <div class="grow"></div>
  <div class="viewsw" id="viewSw" title="What the buyer sees on the screen, or what the office sees">
    <button type="button" data-view="customer">Customer view</button>
    <button type="button" data-view="staff" class="staff">Office view</button>
  </div>
</div></div>

<div class="wrap" id="root"></div>
<div class="totalbar" id="totalbar" style="display:none;"><div class="wrap in" id="totalIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Alden Homes — Selections (vision demo, version 2)
   Made-up data, kept in this browser only. Nothing here touches the real hub.

   What this version shows (agreed with the owner, Oct 2026):
     • Every visit is saved as a LEAD — a buyer who never comes back, or comes back months later, is still on file
     • Customer view (choices + prices only) vs Office view (cost code, our cost, margin)
     • Visit 1 choices can be CHANGED at visit 2 — the change and its price difference are shown
     • More than "pick one": counts (extra outlets), per-room picks (each bathroom), colour-only picks, custom items
     • One room at a time with progress, and a list of what's still to choose before signing
     • Prices are frozen on the sheet: a later price change is offered, never applied silently; locked for good at signing
     • After signing, extras are change orders (the hub's own, with the $100 fee)
     • Office extras: what each vendor needs to see, and upgrades by cost code
   ============================================================ */
const ART = {
  faucet:(metal,arc)=>`<svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="110" fill="#f7f6f1"/><rect x="18" y="86" width="84" height="5" rx="1.5" fill="#dcd8ce"/><ellipse cx="60" cy="86" rx="26" ry="4" fill="#e8e5dd"/>${arc==='high'?`<path d="M46 86 L46 44 Q46 26 60 26 Q74 26 74 44 L74 56" fill="none" stroke="${metal}" stroke-width="6" stroke-linecap="round"/>`:arc==='pull'?`<path d="M46 86 L46 40 Q46 24 62 24 L70 24 Q78 24 78 34 L78 54" fill="none" stroke="${metal}" stroke-width="6" stroke-linecap="round"/><rect x="73" y="52" width="10" height="14" rx="3" fill="${metal}"/>`:`<path d="M46 86 L46 46 Q46 32 60 32 L72 32" fill="none" stroke="${metal}" stroke-width="6" stroke-linecap="round"/>`}<rect x="40" y="82" width="14" height="7" rx="2" fill="${metal}"/><rect x="30" y="66" width="5" height="18" rx="2" fill="${metal}"/></svg>`,
  tile:(c1,c2,grout)=>`<svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="110" fill="${grout}"/>${[0,1,2,3,4].map(r=>[0,1,2,3].map(c=>{const off=r%2?-14:0;const fill=((r+c)%3===0)?c2:c1;return `<rect x="${c*30+off+1}" y="${r*22+1}" width="28" height="20" rx="1" fill="${fill}"/>`;}).join('')).join('')}</svg>`,
  floorPlank:(base,grain)=>`<svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="110" fill="${base}"/>${[0,1,2,3,4,5].map(i=>`<rect x="0" y="${i*18}" width="120" height="17" fill="${base}" stroke="${grain}" stroke-width="0.6" opacity="0.9"/><path d="M${i%2?10:40} ${i*18+6} q30 3 60 -1 t50 2" stroke="${grain}" stroke-width="0.8" fill="none" opacity="0.5"/>`).join('')}</svg>`,
  carpet:(base,fleck)=>`<svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="110" fill="${base}"/>${Array.from({length:150},(_,i)=>{const x=(i*37)%118,y=(i*53)%108;return `<circle cx="${x}" cy="${y}" r="1.6" fill="${fleck}" opacity="0.5"/>`;}).join('')}</svg>`,
  showerDoor:(fw,fc)=>`<svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="110" fill="#f7f6f1"/><rect x="26" y="14" width="68" height="84" fill="#dfeaef" opacity="0.65"/><path d="M34 96 L70 18" stroke="#fff" stroke-width="7" opacity="0.55"/>${fw>0?`<rect x="26" y="14" width="68" height="84" fill="none" stroke="${fc}" stroke-width="${fw}"/>`:''}<rect x="24" y="96" width="72" height="4" rx="1" fill="${fc}"/></svg>`,
  door:(panels,color)=>`<svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="110" fill="#f7f6f1"/><rect x="32" y="8" width="56" height="94" rx="2" fill="${color}" stroke="#c9c2b4" stroke-width="1.2"/><circle cx="82" cy="56" r="2.6" fill="#9a9182"/></svg>`,

window.addEventListener('storage', e=>{

    const was = lead() ? JSON.stringify(lead().answers) : '';
    const before = lead() ? { ...lead().answers } : {};
    try{ const s = JSON.parse(e.newValue || 'null'); if(!s || !Array.isArray(s.leads)) return; leads = s.leads; if(PRESENT) officeView = s.view === 'staff' ? 'staff' : 'customer'; } catch(err){ return; }
    const L = lead();
    if(L && JSON.stringify(L.answers) !== was){
      const key = Object.keys(L.answers).find(k=>JSON.stringify(L.answers[k]) !== JSON.stringify(before[k]));

        const q = qById(key.split('@')[0]), a = L.answers[key];

const base = L=>MODELS[L.model] || 0;
const locked = L=>L.stage === 'signed';
function asked(q, L){
  if(!q.dep) return true;
  const a = L.answers[q.dep.q];
  if(q.dep.is) return !!a && a.label === q.dep.is;
  return !!a && a.label !== q.dep.not;
}
const keysOf = q=>q.each ? q.each.map(r=>q.id+'@'+r) : [q.id];
// counts are optional (zero is an answer); everything else needs a pick
const missing = (q, L)=>q.type === 'qty' || !asked(q, L) ? [] : keysOf(q).filter(k=>!L.answers[k]);
const todo = (L, onlyV1)=>ALL_QS.filter(q=>!onlyV1 || q.v1).flatMap(q=>missing(q, L).map(k=>({ q, key:k })));
// one line per pick that was made, with what it adds
function lines(L){
  const out = [];
  ALL_QS.forEach(q=>{ if(!asked(q, L)) return; keysOf(q).forEach(k=>{
    const a = L.answers[k]; if(!a) return;
    const n = q.type === 'qty' ? a.qty : 1;
    if(q.type === 'qty' && !n) return;
    out.push({ key:k, q, where:k.includes('@') ? k.split('@')[1] : '', label:q.type === 'qty' ? n + ' ' + q.unit + (n === 1 ? '' : 's') : a.label, price:a.price * n, cost:a.cost * n,
      std:q.type !== 'qty' && a.label === q.o[0][0] });
  }); });
  return out;
}
const upgrades = L=>lines(L).reduce((s,l)=>s+l.price,0) + L.custom.reduce((s,c)=>s+c.price,0);
const upgradeCost = L=>lines(L).reduce((s,l)=>s+l.cost,0) + L.custom.reduce((s,c)=>s+c.cost,0);
const coTotal = L=>L.cos.reduce((s,c)=>s+c.price,0) + L.cos.length * CO_FEE;
const total = L=>base(L) + upgrades(L) + coTotal(L);
// today's price for an answer, to spot prices that moved since the sheet was priced
function todayPrice(k, a){
  const q = qById(k.split('@')[0]);
  if(q.type === 'qty') return { price:q.price, cost:q.cost };
  const o = q.o.find(x=>x[0] === a.label); return o ? { price:o[1], cost:o[2] } : { price:a.price, cost:a.cost };

/* ---------- two screens on two devices ----------
   Once the office presses "Open customer screen", this sheet is also kept on the hub's server (a small helper
   made just for this demo). Every second each screen either sends what it changed or asks whether anything is
   new. Only the changes travel, so two people tapping at once don't undo each other. */
const SYNC_URL = 'https://us-central1-alden-homes-hub.cloudfunctions.net/demoSync';
const SHARED = STORE + '.shared';
const SYNC_FIELDS = ['name','name2','phone','email','dev','lot','model','stage','created','v1Date','updated','pricedOn','v1Snap','custom','favs','cos','signedOn'];
let shared = {};                                  // ids of the sheets this device has shared
try{ shared = JSON.parse(localStorage.getItem(SHARED) || '{}') || {}; } catch(e){}
let sync = { id:'', rev:0, last:null, busy:false, nav:'', state:'off', fails:0 };   // state: off | connecting | live | lost | missing
const clone = o=>JSON.parse(JSON.stringify(o));
const same = (a, b)=>JSON.stringify(a) === JSON.stringify(b);
function diffSheet(from, to){
  const ans = {}, del = [], top = {};
  Object.keys(to.answers || {}).forEach(k=>{ if(!from || !same((from.answers || {})[k], to.answers[k])) ans[k] = to.answers[k]; });
  Object.keys((from && from.answers) || {}).forEach(k=>{ if(!(k in (to.answers || {}))) del.push(k); });
  SYNC_FIELDS.forEach(f=>{ if(!from || !same(from[f], to[f])) top[f] = to[f] === undefined ? null : to[f]; });
  return { ans, del, top, any: !!(Object.keys(ans).length || del.length || (from && Object.keys(top).length)) };
}
const syncOn = ()=>!SHOW && !!(PRESENT || (cur && shared[cur]));
async function syncTick(){
  if(!syncOn()){ if(sync.state !== 'off'){ sync = { id:'', rev:0, last:null, busy:false, nav:'', state:'off', fails:0 }; } return; }
  if(sync.busy) return;
  if(sync.id !== cur) sync = { id:cur, rev:0, last:null, busy:false, nav:'', state:'connecting', fails:0 };
  const L = lead(), sent = L ? clone(L) : null;
  let body;
  const navNow = !PRESENT && L && !['vendors','codes'].includes(tab) ? JSON.stringify({ tab, roomId }) : '';
  if(!PRESENT && L && !sync.last){
    // first share from the office: this device's copy is the one that counts
    body = { action:'patch', id:cur, full:sent, ans:sent.answers, del:[], top:diffSheet(null, sent).top, nav:navNow ? JSON.parse(navNow) : null };
  } else if(L && sync.last){
    const d = diffSheet(sync.last, L), navChanged = navNow && navNow !== sync.nav;
    body = d.any || navChanged ? { action:'patch', id:cur, ans:d.ans, del:d.del, top:d.top, ...(navChanged ? { nav:JSON.parse(navNow) } : {}) } : { action:'get', id:cur, since:sync.rev };
  } else body = { action:'get', id:cur, since:0 };
  sync.busy = true;
  const forId = cur;
  try{
    const res = await fetch(SYNC_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) });
    if(!res.ok) throw new Error('sync ' + res.status);
    const data = await res.json();
    if(forId !== cur) return;                      // they opened a different sheet meanwhile
    sync.fails = 0;
    const before = sync.state;
    if(data.missing){ sync.state = 'missing'; }
    else {
      sync.state = 'live';
      if(navNow && body.nav) sync.nav = navNow;
      if(data.sheet){ takeRemote(data.sheet, sent, body); sync.rev = data.rev; }
      if(PRESENT && data.nav){
        const nv = JSON.stringify(data.nav);
        if(nv !== sync.nav){ sync.nav = nv; if(data.nav.tab !== tab || data.nav.roomId !== roomId){ tab = data.nav.tab || tab; roomId = data.nav.roomId || roomId; render(); window.scrollTo(0, 0); } }
      }
    }
    if(before !== sync.state) render();
  } catch(err){
    console.warn('demo sync', err);
    if(++sync.fails >= 3 && sync.state !== 'lost'){ sync.state = 'lost'; render(); }
  } finally { sync.busy = false; }
}
// The server's copy has arrived. Keep anything tapped here while the request was in the air, and point out what the other screen changed.
function takeRemote(sheet, sent, body){
  const now = lead();
  const mine = sent && now ? diffSheet(sent, now) : { ans:{}, del:[], top:{} };
  const merged = clone(sheet);
  merged.answers = merged.answers || {};
  Object.assign(merged.answers, mine.ans);
  mine.del.forEach(k=>{ delete merged.answers[k]; });
  Object.assign(merged, mine.top);
  ['custom','cos'].forEach(f=>{ if(!Array.isArray(merged[f])) merged[f] = []; });
  ['answers','favs'].forEach(f=>{ if(!merged[f] || typeof merged[f] !== 'object') merged[f] = {}; });
  // what changed that this screen didn't do itself
  const theirs = sent ? Object.keys(sheet.answers || {}).find(k=>!same((sent.answers || {})[k], sheet.answers[k]) && !(body.ans && k in body.ans)) : '';
  const i = leads.findIndex(l=>l.id === merged.id);
  if(i >= 0) leads[i] = merged; else leads.push(merged);
  sync.last = clone(sheet);
  const changed = !sent || !same(sent, merged);
  if(theirs){
    const q = qById(theirs.split('@')[0]), a = sheet.answers[theirs];
    if(q){ flashKey = theirs; toast((PRESENT ? 'Updated: ' : 'The customer picked: ') + q.t + (theirs.includes('@') ? ' (' + theirs.split('@')[1] + ')' : '') + ' — ' + (q.type === 'qty' ? a.qty : a.label)); }
  }
  if(changed){ const y = window.scrollY; render(); window.scrollTo(0, y); }
  flashKey = '';
}

      const copy = svg.cloneNode(true); copy.setAttribute('width', w); copy.setAttribute('height', h); copy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const png = await toPng('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(copy)), w, h);

            <div class="mono" style="font-size:30px;font-weight:700;letter-spacing:5px;margin-top:6px;color:var(--navy)">${esc(shareCode(L))}</div></div>
          <div><label class="f" style="color:inherit">Or send the link</label>
            <input type="text" readonly value="${esc(presentUrl(L))}" onclick="this.select()">
            <div style="margin-top:8px"><button type="button" class="btn sm" id="shareCopy">Copy link</button> <button type="button" class="btn sm" id="shareOpenBtn">Open in a new window here</button></div></div>
        </div>
        <div style="font-size:12.5px;margin-top:12px">Demo note: the sample sheet is kept on the hub's server while it's shared, and anyone with the code or link can open it. It's made-up data.</div></div>` : ''}
    ${d.length && !PRESENT ? `<div class="banner amber noprint"><p><strong>${d.length} price${d.length===1?' has':'s have'} changed since this sheet was priced on ${esc(nice(L.pricedOn))}.</strong>
        At today's prices the same choices come to ${money(Math.abs(dSum))} ${dSum >= 0 ? 'more' : 'less'}. The sheet keeps the prices it was quoted at until someone decides.
        <span class="muted" style="display:block;font-size:13px;margin-top:4px">${d.map(x=>esc(qById(x.k.split('@')[0]).t) + ': ' + money(x.a.price) + ' → ' + money(x.t.price)).join(' · ')}</span></p>
        <button type="button" class="btn sm" id="repriceBtn">Update to today's prices</button></div>` : ''}
    ${locked(L) ? `<div class="banner good"><p><strong>Signed on ${esc(nice(L.signedOn))}.</strong> These choices and their prices are locked for good. Anything new is a change order.</p></div>` : ''}
    <div class="tabs noprint">${tabs}</div>
    ${body}`;
}

/* one question, in any of its forms */
function question(q, L, opts){
  if(!asked(q, L)) return '';
  const staff = view === 'staff', lock = locked(L);
  const snap = L.v1Snap || {};
  const optCard = (key, o, i)=>{
    const a = L.answers[key], sel = a && a.label === o[0];
    const fav = L.favs[key + '|' + o[0]];
    // a sheet shows the price it was quoted at for the picked option, today's price for the others
    const price = sel ? a.price : o[1], cost = sel ? a.cost : o[2];
    return `<button type="button" class="opt ${sel?'sel':''}${sel && flashKey === key ? ' flash' : ''}" data-pick="${esc(key)}" data-opt="${esc(o[0])}" ${lock?'disabled':''}>
      <div class="art">${o[3] || ''}</div>${i === 0 ? '<span class="std">Standard</span>' : ''}<span class="tick">&#10003;</span>
      <div class="txt"><div class="nm">${esc(o[0])}</div>
        <div class="pr ${price === 0 ? 'inc' : ''}">${price === 0 ? (i === 0 ? 'Included' : 'No extra cost') : '+ ' + money(price)}</div>
        ${staff && price ? `<div class="staffline">our cost ${money(cost)} · margin ${money(price - cost)}</div>` : ''}</div>
      ${!lock && !sel ? `<span class="fav ${fav?'on':''}" data-fav="${esc(key + '|' + o[0])}" title="Mark as a favourite">${fav ? '&#9829;' : '&#9825;'}</span>` : ''}
    </button>`;
  };
  const changed = key=>{
    if(!q.v1 || !L.v1Snap || !L.answers[key] || snap[key] == null || snap[key] === L.answers[key].label) return '';
    const was = q.o.find(o=>o[0] === snap[key]), diff = L.answers[key].price - (was ? was[1] : 0);
    return `<div class="changed">Changed since visit 1: was <strong>${esc(snap[key])}</strong> · ${diff === 0 ? 'no change in price' : (diff > 0 ? '+ ' : '− ') + money(Math.abs(diff))}</div>`;
  };
  const miss = missing(q, L);
  let inner;
  if(q.type === 'qty'){
    const a = L.answers[q.id] || { qty:0, price:q.price, cost:q.cost };
    inner = `<div class="qty"><div class="stepper"><button type="button" data-qty="${q.id}" data-d="-1" ${lock || !a.qty ? 'disabled' : ''}>&minus;</button><span>${a.qty}</span><button type="button" data-qty="${q.id}" data-d="1" ${lock || a.qty >= q.max ? 'disabled' : ''}>+</button></div>
      <div><strong>${money(a.price)}</strong> per ${esc(q.unit)}${a.qty ? ` · <span class="mono" style="font-weight:700;color:var(--navy)">+ ${money(a.price * a.qty)}</span>` : ''}
        ${staff ? `<div class="staffline">our cost ${money(a.cost)} each · margin ${money(a.price - a.cost)} each</div>` : ''}</div></div>`;
  } else if(q.each){
    inner = q.each.map(r=>{ const key = q.id + '@' + r; return `<div class="eachrow"><div class="rm">${esc(r)}${!L.answers[key] ? ' <span class="chip red" style="margin-left:6px">to choose</span>' : ''}</div><div class="opts">${q.o.map((o,i)=>optCard(key, o, i)).join('')}</div></div>`; }).join('');
  } else {
    inner = `<div class="opts">${q.o.map((o,i)=>optCard(q.id, o, i)).join('')}</div>${changed(q.id)}`;
  }
  return `<div class="q ${miss.length && !lock ? 'todo' : ''}" id="q-${q.id}">
    <div class="q-head"><h3>${esc(q.t)}</h3>
      ${q.v1 && opts.fullSheet ? '<span class="chip v1">chosen at visit 1 · can still change</span>' : ''}
      ${q.type === 'color' ? '<span class="chip plain">colour · no cost</span>' : ''}
      ${q.each ? '<span class="chip plain">pick for each room</span>' : ''}
      ${staff ? `<span class="chip" style="background:var(--staff-soft);color:var(--staff)">code ${q.cc} · ${esc(q.vendor || 'Alden')}</span>` : ''}</div>
    ${q.note ? `<div class="q-sub">${esc(q.note)}</div>` : ''}
    ${inner}</div>`;
}

function visit1(L){
  const left = todo(L, true).length;
  return `<div style="margin-top:18px"><div class="eyebrow">Visit 1 · first meeting</div><h2 style="font-size:22px;margin-top:4px">The big choices</h2>
      <p class="lede">A handful of choices that move the price the most, so you leave today with a real ballpark. Nothing here is final. It's all saved, and it can all be changed when you come back.</p></div>
    ${ROOMS.map(r=>r.qs.filter(q=>q.v1).map(q=>question(q, L, {})).join('')).join('')}
    ${locked(L) ? '' : `<div class="card noprint" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <p style="flex:1 1 260px">${left ? `<strong>${left} still to choose.</strong> You can save now and finish later.` : '<strong>That\'s everything for a first visit.</strong>'} This sheet stays on file as a lead either way.</p>
      ${PRESENT ? '' : '<button type="button" class="btn" id="saveClose">Save &amp; close</button>'}
      <button type="button" class="btn primary" id="toFull">Carry on to full selections</button></div>`}`;
}

function full(L){
  const staff = view === 'staff';
  const prog = r=>{ const qs = r.qs.filter(q=>asked(q, L)); const keys = qs.filter(q=>q.type !== 'qty').flatMap(keysOf); return { n:keys.length, done:keys.filter(k=>L.answers[k]).length }; };
  const nav = ROOMS.map(r=>{ const p = prog(r), all = p.done === p.n;
    return `<button type="button" class="${roomId===r.id?'on':''}" data-room="${r.id}"><div class="rn"><span>${esc(r.name)}</span>${all ? '<span class="done">&#10003;</span>' : ''}</div>
      <div class="rp">${all ? 'All chosen' : p.done + ' of ' + p.n + ' chosen'}</div><div class="bar"><span style="width:${p.n ? p.done/p.n*100 : 100}%"></span></div></button>`; }).join('');
  const r = ROOMS.find(x=>x.id===roomId) || ROOMS[0], i = ROOMS.indexOf(r), next = ROOMS[i+1];
  const mine = L.custom.map((c, ci)=>({ c, ci })).filter(x=>x.c.room === r.id);
  return `<div class="rooms">
    <div class="roomnav noprint">${nav}</div>
    <div>
      <div class="eyebrow">Room ${i+1} of ${ROOMS.length}</div><h2 style="font-size:22px;margin-top:4px">${esc(r.name)}</h2>
      ${r.by && !locked(L) ? `<div class="deadline">Choose by <strong>${esc(nice(daysAhead(r.by.days)))}</strong> — that's when ${esc(r.by.why)}.</div>` : ''}
      ${r.qs.map(q=>question(q, L, { fullSheet:true })).join('')}
      ${mine.map(({c, ci})=>`<div class="q"><div class="q-head"><h3>${esc(c.desc)}</h3><span class="chip plain">special request</span></div>
        <div style="margin-top:8px"><span class="mono" style="font-weight:700;color:var(--navy)">+ ${money(c.price)}</span>${staff ? ` <span class="staffline" style="display:inline-block">our cost ${money(c.cost)} · margin ${money(c.price - c.cost)} · code ${c.cc}</span>` : ''}
        ${staff && !locked(L) ? ` <button type="button" class="btn sm" data-delcustom="${ci}" style="margin-left:8px">Remove</button>` : ''}</div></div>`).join('')}
      ${staff && !locked(L) ? `<div class="q" style="border:1px dashed var(--staff);box-shadow:none;background:var(--staff-soft)"><div class="q-head"><h3 style="color:var(--staff)">Something not on the list</h3><span class="chip" style="background:#fff;color:var(--staff)">office only</span></div>
        <div class="grid" style="margin-top:10px">
          <div style="grid-column:1/-1"><label class="f">What is it</label><input type="text" id="cuDesc" placeholder="e.g. Built-in bench in the mudroom"></div>
          <div><label class="f">Customer price ($)</label><input type="number" id="cuPrice" min="0" step="1"></div>
          <div><label class="f">Our cost ($)</label><input type="number" id="cuCost" min="0" step="1"></div>
          <div><label class="f">Cost code</label><select id="cuCode">${Object.entries(CODE_NAMES).map(([c,n])=>`<option value="${c}">${c} — ${n}</option>`).join('')}</select></div>
        </div><div style="margin-top:10px"><button type="button" class="btn sm" id="cuAdd">Add to this sheet</button></div></div>`
        : (!locked(L) ? `<p class="muted" style="font-size:13.5px;margin-top:14px">Want something that isn't shown? Ask, and we'll price it and add it to your sheet.</p>` : '')}
      <div class="noprint" style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        ${i > 0 ? `<button type="button" class="btn" data-room="${ROOMS[i-1].id}">&larr; ${esc(ROOMS[i-1].name)}</button>` : ''}
        <div class="grow"></div>
        ${next ? `<button type="button" class="btn primary" data-room="${next.id}">Next: ${esc(next.name)} &rarr;</button>` : `<button type="button" class="btn primary" data-tab="summary">See the summary &rarr;</button>`}
      </div>
    </div></div>`;
}

function summary(L){
  const staff = view === 'staff', ls = lines(L), left = todo(L);
  const rows = ROOMS.map(r=>{
    const mine = ls.filter(l=>l.q.room.id === r.id), cu = L.custom.filter(c=>c.room === r.id);
    if(!mine.length && !cu.length) return '';
    const sub = mine.reduce((s,l)=>s+l.price,0) + cu.reduce((s,c)=>s+c.price,0);
    return `<tr class="grp"><td colspan="2">${esc(r.name)}</td><td class="num">${sub ? '+ ' + money(sub) : 'included'}</td>${staff ? '<td class="st"></td><td class="st"></td>' : ''}</tr>`
      + mine.map(l=>`<tr><td>${esc(l.q.t)}${l.where ? ` <span class="muted">· ${esc(l.where)}</span>` : ''}</td><td>${esc(l.label)}</td>
          <td class="num">${l.price ? '+ ' + money(l.price) : '<span class="muted">' + (l.std ? 'included' : 'no cost') + '</span>'}</td>
          ${staff ? `<td class="num st">${l.cost ? money(l.cost) : ''}</td><td class="num st">${l.price ? money(l.price - l.cost) : ''}</td>` : ''}</tr>`).join('')
      + cu.map(c=>`<tr><td>Special request</td><td>${esc(c.desc)}</td><td class="num">+ ${money(c.price)}</td>${staff ? `<td class="num st">${money(c.cost)}</td><td class="num st">${money(c.price - c.cost)}</td>` : ''}</tr>`).join('');
  }).join('');
  const up = upgrades(L), upCost = upgradeCost(L);
  return `
    ${left.length && !locked(L) ? `<div class="banner amber noprint"><p><strong>${left.length} still to choose</strong> before this can be signed: ${left.slice(0, 8).map(x=>`<a href="#" data-jump="${x.q.room.id}" style="color:inherit">${esc(x.q.t)}${x.key.includes('@') ? ' (' + esc(x.key.split('@')[1]) + ')' : ''}</a>`).join(', ')}${left.length > 8 ? ', and ' + (left.length - 8) + ' more' : ''}.</p></div>` : ''}
    <div class="card"><h2>Everything on this sheet</h2>
      <div style="overflow-x:auto;margin-top:10px"><table>
        <thead><tr><th>Item</th><th>Choice</th><th class="num">Price</th>${staff ? '<th class="num st">Our cost</th><th class="num st">Margin</th>' : ''}</tr></thead>
        <tbody>
          <tr><td><strong>${esc(L.model)}</strong> — base price</td><td class="muted">everything marked Standard</td><td class="num"><strong>${money(base(L))}</strong></td>${staff ? '<td class="st"></td><td class="st"></td>' : ''}</tr>
          ${rows}
          <tr class="tot"><td colspan="2">Upgrades</td><td class="num">+ ${money(up)}</td>${staff ? `<td class="num st">${money(upCost)}</td><td class="num st">${money(up - upCost)} (${up ? Math.round((up - upCost) / up * 100) : 0}%)</td>` : ''}</tr>
          ${L.cos.map(c=>`<tr><td>Change order · ${esc(nice(c.date))}</td><td>${esc(c.desc)}</td><td class="num">+ ${money(c.price)}</td>${staff ? `<td class="num st">${money(c.cost)}</td><td class="num st">${money(c.price - c.cost)}</td>` : ''}</tr>`).join('')}
          ${L.cos.length ? `<tr><td colspan="2">Change order fees (${L.cos.length} × ${money(CO_FEE)})</td><td class="num">+ ${money(L.cos.length * CO_FEE)}</td>${staff ? '<td class="st"></td><td class="st"></td>' : ''}</tr>` : ''}
          <tr class="tot"><td colspan="2">Total</td><td class="num">${money(total(L))}</td>${staff ? '<td class="st"></td><td class="st"></td>' : ''}</tr>
        </tbody></table></div></div>`;
}

function sign(L){
  const left = todo(L);
  if(locked(L)) return `
    <div class="card"><h2>Signed selection sheet</h2>
      <p class="lede">Signed by ${esc([L.name, L.name2].filter(Boolean).join(' and '))} on ${esc(nice(L.signedOn))}. Total at signing ${money(base(L) + upgrades(L))}.</p>
      <div class="noprint" style="margin-top:12px"><button type="button" class="btn" id="printBtn">Print or save a copy</button></div></div>
    ${shareSheetCard(L)}
    ${summary(L)}
    <div class="card noprint"><h2>Change orders</h2>
      <p class="lede">Anything added after signing goes through the hub's change orders: the buyer reviews and signs it on their homeowner page, and it carries the ${money(CO_FEE)} fee.</p>
      ${view === 'staff' ? `<div class="grid" style="margin-top:12px">
          <div style="grid-column:1/-1"><label class="f">What's changing</label><input type="text" id="coDesc" placeholder="e.g. Add a floor outlet in the office"></div>
          <div><label class="f">Customer price ($)</label><input type="number" id="coPrice" min="0" step="1"></div>
          <div><label class="f">Our cost ($)</label><input type="number" id="coCost" min="0" step="1"></div>
          <div><label class="f">Cost code</label><select id="coCode">${Object.entries(CODE_NAMES).map(([c,n])=>`<option value="${c}">${c} — ${n}</option>`).join('')}</select></div>
        </div><div style="margin-top:10px"><button type="button" class="btn sm" id="coAdd">Send change order to the buyer (+ ${money(CO_FEE)} fee)</button></div>`
        : `<p class="muted" style="margin-top:10px;font-size:14px">Switch to Office view to write one.</p>`}</div>`;
  return `
    <div class="card"><div class="eyebrow">Sign</div><h2 style="font-size:22px;margin-top:4px">Approve these selections</h2>
      <p class="lede">Signing makes this sheet the record of what's being built, at the prices shown. After that, changes go through a change order, which is reviewed by the office and carries a ${money(CO_FEE)} fee.</p>
      ${left.length ? `<div class="banner amber"><p><strong>${left.length} item${left.length===1?'':'s'} still to choose.</strong> The sheet can be signed once everything has an answer.</p><button type="button" class="btn sm" data-tab="summary">See what's left</button></div>` : `
      <div class="grid" style="margin-top:16px">
        <div><label class="f">Buyer</label><input type="text" id="sg1" value="${esc(L.name)}"></div>
        <div><label class="f">Second buyer</label><input type="text" id="sg2" value="${esc(L.name2 || '')}" placeholder="If there is one"></div>
      </div>
      <label style="display:flex;gap:10px;align-items:flex-start;margin-top:14px;cursor:pointer"><input type="checkbox" id="sgAgree" style="width:20px;height:20px;margin-top:2px;flex:none">
        <span>We approve these selections as final for ${esc(homeLabel(L))} at ${money(total(L))}, and understand that later changes are change orders.</span></label>
      <div style="margin-top:14px"><button type="button" class="btn good" id="signBtn">Sign &amp; lock</button></div>`}
    </div>`;
}

function vendors(L){
  const by = {};
  lines(L).forEach(l=>{ const v = l.q.vendor || 'Alden (in-house)'; (by[v] = by[v] || []).push(l); });
  return `<div class="banner staff"><p><strong>What each vendor needs.</strong> Once the sheet is signed, each vendor would see their part on their own link in the hub, with no retyping. Prices are left off.</p></div>
    ${Object.keys(by).sort().map(v=>`<div class="card"><h2>${esc(v)}</h2><table style="margin-top:8px"><tbody>
      ${by[v].map(l=>`<tr><td style="width:42%">${esc(l.q.t)}${l.where ? ` <span class="muted">· ${esc(l.where)}</span>` : ''}</td><td><strong>${esc(l.label)}</strong>${l.std ? ' <span class="muted">(standard)</span>' : ''}</td><td class="muted" style="width:90px">code ${l.q.cc}</td></tr>`).join('')}
    </tbody></table></div>`).join('')}`;
}

function codes(L){
  const by = {};
  const put = (cc, price, cost)=>{ by[cc] = by[cc] || { price:0, cost:0 }; by[cc].price += price; by[cc].cost += cost; };
  lines(L).forEach(l=>put(l.q.cc, l.price, l.cost));
  L.custom.forEach(c=>put(c.cc, c.price, c.cost));
  L.cos.forEach(c=>put(c.cc, c.price, c.cost));
  if(L.cos.length) put(90, L.cos.length * CO_FEE, 0);
  const rows = Object.entries(by).filter(([,v])=>v.price || v.cost).sort((a,b)=>a[0]-b[0]);
  const tp = rows.reduce((s,[,v])=>s+v.price,0), tc = rows.reduce((s,[,v])=>s+v.cost,0);
  return `<div class="banner staff"><p><strong>Upgrades by cost code.</strong> The "our cost" column is what this sheet adds to the home's budget, on top of the base budget for the model. The price column is what it adds to the settlement.</p></div>
    <div class="card"><table><thead><tr><th>Code</th><th>Section</th><th class="num">Adds to settlement</th><th class="num">Adds to budget</th><th class="num">Margin</th></tr></thead><tbody>
      ${rows.map(([cc,v])=>`<tr><td class="mono">${cc}</td><td>${esc(CODE_NAMES[cc] || '')}</td><td class="num">${money(v.price)}</td><td class="num">${money(v.cost)}</td><td class="num">${money(v.price - v.cost)}</td></tr>`).join('')}
      <tr class="tot"><td colspan="2">Total</td><td class="num">${money(tp)}</td><td class="num">${money(tc)}</td><td class="num">${money(tp - tc)}</td></tr>
    </tbody></table></div>`;
}

function totalBar(L){
  const up = upgrades(L), co = coTotal(L);
  return `<div><div class="sub">${locked(L) ? 'Contract total' : L.stage === 'v1' ? 'Ballpark so far' : 'Total so far'}</div><div class="big">${money(total(L))}</div></div>
    <div class="sub">Base ${money(base(L))}<br>Upgrades + ${money(up)}${co ? ' · change orders + ' + money(co) : ''}</div>
    <div class="grow"></div>
    ${locked(L) ? '' : '<span class="sub">Saved automatically</span>'}
    ${PRESENT ? '' : `<button type="button" class="btn" id="saveClose2">${locked(L) ? 'Close' : 'Save &amp; close'}</button>`}`;
}

/* ---------- doing things ---------- */
function touch(L){ L.updated = iso(new Date()); }
document.addEventListener('click', e=>{
  const t = e.target, L = lead();
  const sw = t.closest('#viewSw button'); if(sw){ view = sw.dataset.view; if(view !== 'staff' && ['vendors','codes'].includes(tab)) tab = 'summary'; render(); return; }
  if(t.closest('#shPdf')){ showPdf(t.closest('#shPdf')); return; }
  if(t.closest('#shShare')){
    const url = location.href, title = document.title;
    if(navigator.share) navigator.share({ title, text:'Take a look at what we chose for our Alden home.', url }).catch(()=>{});
    else navigator.clipboard.writeText(url).then(()=>toast('Link copied — paste it anywhere'), ()=>toast('Copy the address from the bar above'));
    return;
  }
  if(t.closest('#joinBtn')){
    const code = ($('joinCode').value || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    if(code.length < 4){ toast('Type the code from the rep\'s screen'); return; }
    location.href = location.href.split('?')[0].split('#')[0] + '?present=L' + encodeURIComponent(code); return;
  }
  if(t.closest('#resetDemo')){ e.preventDefault(); leads = seedLeads(); render(); toast('Sample leads put back'); return; }
  if(t.closest('#newLeadBtn')){ newOpen = !newOpen; render(); if(newOpen) $('nName').focus(); return; }
  if(t.closest('#nStart')){
    const name = $('nName').value.trim(); if(!name){ toast('Add the buyer\'s name first'); return; }
    const n = { id:'L'+Math.random().toString(36).slice(2,8), name, name2:$('nName2').value.trim(), phone:$('nPhone').value.trim(), email:$('nEmail').value.trim(), dev:$('nDev').value, lot:$('nLot').value, model:$('nModel').value,
      stage:'v1', created:iso(new Date()), v1Date:iso(new Date()), updated:iso(new Date()), pricedOn:iso(new Date()), answers:{}, v1Snap:null, custom:[], favs:{}, cos:[], signedOn:'' };
    leads.push(n); cur = n.id; tab = 'v1'; roomId = 'home'; newOpen = false; render(); window.scrollTo(0, 0); toast('Lead saved'); return;
  }
  const open = t.closest('[data-open]'); if(open){ cur = open.dataset.open; const o = lead(); tab = o.stage === 'v1' ? 'v1' : o.stage === 'signed' ? 'sign' : 'full'; roomId = 'home'; render(); window.scrollTo(0, 0); return; }
  if(!L) return;
  if(t.closest('#shareBtn')){
    shareOpen = !shareOpen;
    if(shareOpen && !shared[L.id]){ shared[L.id] = true; try{ localStorage.setItem(SHARED, JSON.stringify(shared)); } catch(err){} syncTick(); }
    render(); return;
  }
  if(t.closest('#shareCopy')){ navigator.clipboard.writeText(presentUrl(L)).then(()=>toast('Link copied'), ()=>toast('Select the link and copy it')); return; }
  if(t.closest('#shareOpenBtn')){ window.open(presentUrl(L), 'aldenCustomerScreen', 'width=1000,height=800'); return; }
  if(t.closest('#backLeads') || t.closest('#saveClose') || t.closest('#saveClose2')){ e.preventDefault(); cur = null; render(); window.scrollTo(0, 0); if(!locked(L)) toast('Saved. It\'s on file whenever they come back.'); return; }
  const tb = t.closest('[data-tab]'); if(tb){ tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const rm = t.closest('[data-room]'); if(rm){ roomId = rm.dataset.room; tab = 'full'; render(); window.scrollTo(0, 0); return; }
  const jump = t.closest('[data-jump]'); if(jump){ e.preventDefault(); roomId = jump.dataset.jump; tab = 'full'; render(); window.scrollTo(0, 0); return; }
  if(t.closest('#printBtn')){ window.print(); return; }
  if(t.closest('#showMake')){
    // the sheet has to be on the hub's server for the link to work on someone else's phone
    shared[L.id] = true; try{ localStorage.setItem(SHARED, JSON.stringify(shared)); } catch(err){}
    syncTick(); render(); toast('Share link ready'); return;
  }
  if(t.closest('#showCopy')){ navigator.clipboard.writeText(showUrl(L)).then(()=>toast('Link copied'), ()=>toast('Select the link and copy it')); return; }
  if(t.closest('#showOpen')){ window.open(showUrl(L), '_blank'); return; }
  if(t.closest('#repriceBtn')){
    drift(L).forEach(x=>{ x.a.price = x.t.price; x.a.cost = x.t.cost; });
    L.pricedOn = iso(new Date()); touch(L); render(); toast('Updated to today\'s prices'); return;
  }
  if(locked(L)){
    if(t.closest('#coAdd')){
      const desc = $('coDesc').value.trim(), price = Number($('coPrice').value);
      if(!desc || !(price >= 0) || $('coPrice').value === ''){ toast('Say what\'s changing and the price'); return; }
      L.cos.push({ desc, price, cost:Number($('coCost').value) || 0, cc:Number($('coCode').value), date:iso(new Date()) }); touch(L); render(); toast('Change order sent to the buyer to sign');
    }
    return;
  }
  const fav = t.closest('[data-fav]'); if(fav){ e.stopPropagation(); L.favs[fav.dataset.fav] = !L.favs[fav.dataset.fav]; if(!L.favs[fav.dataset.fav]) delete L.favs[fav.dataset.fav]; render(); return; }
  const pick = t.closest('[data-pick]');
  if(pick){
    const key = pick.dataset.pick, q = qById(key.split('@')[0]), o = q.o.find(x=>x[0] === pick.dataset.opt);
    L.answers[key] = { label:o[0], price:o[1], cost:o[2] };
    // an answer can make another question irrelevant (no fireplace -> no mantel); drop those answers
    ALL_QS.forEach(x=>{ if(!asked(x, L)) keysOf(x).forEach(k=>{ delete L.answers[k]; }); });
    touch(L); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  const qb = t.closest('[data-qty]');
  if(qb){
    const q = qById(qb.dataset.qty), a = L.answers[q.id] || { qty:0, price:q.price, cost:q.cost };
    a.qty = Math.max(0, Math.min(q.max, a.qty + Number(qb.dataset.d))); L.answers[q.id] = a;
    touch(L); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if(t.closest('#toFull')){
    // the first time they move on, remember what visit 1 looked like, so later changes can be shown
    if(!L.v1Snap) L.v1Snap = Object.fromEntries(Object.entries(L.answers).filter(([k])=>qById(k.split('@')[0]).v1).map(([k,v])=>[k, v.label]));
    L.stage = 'v2'; tab = 'full'; roomId = 'home'; touch(L); render(); window.scrollTo(0, 0); return;
  }
  if(t.closest('#cuAdd')){
    const desc = $('cuDesc').value.trim(), price = Number($('cuPrice').value);
    if(!desc || $('cuPrice').value === '' || !(price >= 0)){ toast('Say what it is and the price'); return; }
    L.custom.push({ desc, price, cost:Number($('cuCost').value) || 0, cc:Number($('cuCode').value), room:roomId }); touch(L); render(); toast('Added to the sheet'); return;
  }
  const dc = t.closest('[data-delcustom]'); if(dc){ L.custom.splice(Number(dc.dataset.delcustom), 1); touch(L); render(); return; }
  if(t.closest('#signBtn')){
    if(!$('sg1').value.trim()){ toast('Add the buyer\'s name'); return; }
    if(!$('sgAgree').checked){ toast('Tick the box to approve first'); return; }
    L.name = $('sg1').value.trim(); L.name2 = $('sg2').value.trim();
    L.stage = 'signed'; L.signedOn = iso(new Date()); L.pricedOn = L.signedOn; touch(L); tab = 'sign'; render(); window.scrollTo(0, 0); toast('Signed and locked');
  }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Enter' && e.target.id === 'joinCode') $('joinBtn').click(); });
document.addEventListener('change', e=>{
  if(e.target.id === 'nDev'){ const d = e.target.value; $('nLot').innerHTML = '<option value="">Not chosen yet</option>' + LOTS.filter(l=>l.dev === d).map(l=>`<option value="${l.lot}">Lot ${l.lot} — ${esc(l.addr)}</option>`).join(''); }
});

load();
if(SHOW) loadShow();
// the customer's screen opens on whatever the office is looking at
if(PRESENT){ try{ const nv = JSON.parse(localStorage.getItem(NAV) || 'null'); if(nv && nv.id === PRESENT){ tab = nv.tab; roomId = nv.roomId; } } catch(e){} }
if(!SHOW) render();
</script>
</body>
</html>
